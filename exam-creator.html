<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sınav Oluşturucu - BST</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h1 { color: #fa709a; text-align: center; margin-bottom: 30px; }
        .form-group { margin: 25px 0; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; font-family: 'Segoe UI', sans-serif; }
        input:focus, select:focus, textarea:focus { border-color: #fa709a; outline: none; }
        .questions-list { background: #f9f9f9; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .question-item { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; border-left: 4px solid #fa709a; }
        .question-controls { display: flex; gap: 10px; margin-top: 15px; }
        .btn { padding: 12px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn:hover { transform: translateY(-2px); }
        .btn-add { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Sınav Oluşturucu</h1>
        <p style="text-align:center; color:#666; margin-bottom:30px;">Öğrencilerin için özel sınavlar hazırla</p>

        <div class="form-group">
            <label>📚 Sınav Başlığı</label>
            <input type="text" id="examTitle" placeholder="Örn: 5. Sınıf Ünite 1 Değerlendirme">
        </div>

        <div class="form-group">
            <label>📖 Sınıf ve Ünite</label>
            <select id="examUnit">
                <option>5. Sınıf - Ünite 1</option>
                <option>5. Sınıf - Ünite 2</option>
                <option>5. Sınıf - Ünite 3</option>
                <option>5. Sınıf - Ünite 4</option>
                <option>5. Sınıf - Ünite 5</option>
                <option>5. Sınıf - Ünite 6</option>
                <option>6. Sınıf - Ünite 1</option>
                <option>6. Sınıf - Ünite 2</option>
                <option>6. Sınıf - Ünite 3</option>
                <option>6. Sınıf - Ünite 4</option>
                <option>6. Sınıf - Ünite 5</option>
            </select>
        </div>

        <div class="form-group">
            <label>⏱️ Süre (dakika)</label>
            <input type="number" id="examDuration" placeholder="40" min="10" max="120">
        </div>

        <div class="questions-list" id="questionsList">
            <h3 style="color:#fa709a; margin-bottom:15px;">Sorular</h3>
            <div class="question-item">
                <label style="margin-bottom:10px;">❓ Soru 1</label>
                <textarea rows="3" placeholder="Soru metnini buraya yazın..."></textarea>
                <div style="margin-top:15px;">
                    <label style="font-size:0.9em;">Seçenekler:</label>
                    <input type="text" placeholder="A) Seçenek 1" style="margin:5px 0;">
                    <input type="text" placeholder="B) Seçenek 2" style="margin:5px 0;">
                    <input type="text" placeholder="C) Seçenek 3" style="margin:5px 0;">
                    <input type="text" placeholder="D) Seçenek 4" style="margin:5px 0;">
                </div>
                <div style="margin-top:10px;">
                    <label style="font-size:0.9em;">Doğru Cevap:</label>
                    <select style="width:auto; padding:8px;">
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                        <option>D</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="btn btn-add" onclick="addQuestion()">➕ Yeni Soru Ekle</button>

        <div style="margin-top:40px; display:flex; gap:15px; justify-content:center;">
            <button class="btn btn-primary" onclick="createExam()">✅ Sınavı Oluştur</button>
            <button class="btn btn-secondary" onclick="previewExam()">👁️ Önizle</button>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">❌ İptal</button>
        </div>
    </div>

    <script>
        let questionCount = 1;

        function addQuestion() {
            questionCount++;
            const questionsList = document.getElementById('questionsList');
            const newQuestion = document.createElement('div');
            newQuestion.className = 'question-item';
            newQuestion.innerHTML = `
                <label style="margin-bottom:10px;">❓ Soru ${questionCount}</label>
                <textarea rows="3" placeholder="Soru metnini buraya yazın..."></textarea>
                <div style="margin-top:15px;">
                    <label style="font-size:0.9em;">Seçenekler:</label>
                    <input type="text" placeholder="A) Seçenek 1" style="margin:5px 0;">
                    <input type="text" placeholder="B) Seçenek 2" style="margin:5px 0;">
                    <input type="text" placeholder="C) Seçenek 3" style="margin:5px 0;">
                    <input type="text" placeholder="D) Seçenek 4" style="margin:5px 0;">
                </div>
                <div style="margin-top:10px;">
                    <label style="font-size:0.9em;">Doğru Cevap:</label>
                    <select style="width:auto; padding:8px;">
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                        <option>D</option>
                    </select>
                </div>
                <button class="btn btn-secondary" style="margin-top:10px; padding:8px 20px;" onclick="this.parentElement.remove(); questionCount--;">🗑️ Sil</button>
            `;
            questionsList.appendChild(newQuestion);
        }

        function createExam() {
            const title = document.getElementById('examTitle').value;
            if (!title) {
                alert('Lütfen sınav başlığı girin!');
                return;
            }
            alert('Sınav oluşturuldu: ' + title + '\n\nSınav dosyası kaydedildi ve öğrencilerle paylaşılabilir.');
        }

        function previewExam() {
            alert('Sınav önizlemesi açılıyor...\n\nBu özellik yakında eklenecek!');
        }
    </script>
</body>
</html>
