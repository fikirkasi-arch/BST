<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ünite 1 Quiz - Bilişim Temelleri</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quiz-container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .quiz-header p {
            color: #666;
            font-size: 1.1em;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 18px 25px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.05em;
        }

        .option:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .option.wrong {
            border-color: #f44336;
            background: #ffebee;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .result-card {
            text-align: center;
            display: none;
            padding: 40px;
        }

        .result-card.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        .result-card h2 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .result-score {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .result-message {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 30px;
        }

        .result-details {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin: 25px 0;
        }

        .result-details p {
            font-size: 1.1em;
            color: #333;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 20px;
            }

            .quiz-header h1 {
                font-size: 1.5em;
            }

            .question-text {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1>📚 Ünite 1: Bilişim Temelleri</h1>
            <p>Quiz - Terim Bilgisi Testi</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>

        <div id="quizContent">
            <!-- Questions will be inserted here -->
        </div>

        <div class="result-card" id="resultCard">
            <h2>🎉 Quiz Tamamlandı!</h2>
            <div class="result-score" id="resultScore">0/10</div>
            <div class="result-message" id="resultMessage"></div>
            <div class="result-details">
                <p><strong>Doğru Cevaplar:</strong> <span id="correctCount">0</span></p>
                <p><strong>Yanlış Cevaplar:</strong> <span id="wrongCount">0</span></p>
                <p><strong>Başarı Oranı:</strong> <span id="percentageScore">0%</span></p>
            </div>
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 Tekrar Dene</button>
            <button class="btn btn-secondary" onclick="window.location.href='sozluk.html'" style="margin-left: 10px">📖 Sözlüğe Dön</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Bilgisayarın beyni olarak adlandırılan, tüm hesaplamaları yapan parça hangisidir?",
                options: ["RAM", "Hard Disk", "CPU (İşlemci)", "Anakart"],
                correct: 2
            },
            {
                question: "Bilgisayarda geçici olarak veri saklayan, kapatınca bilgileri silen bellek türü hangisidir?",
                options: ["RAM", "SSD", "HDD", "USB"],
                correct: 0
            },
            {
                question: "Bilgisayarın fiziksel parçalarına ne ad verilir?",
                options: ["Yazılım", "Donanım", "İşletim Sistemi", "Program"],
                correct: 1
            },
            {
                question: "Hangi depolama birimi en büyüktür?",
                options: ["1 KB (Kilobyte)", "1 GB (Gigabyte)", "1 MB (Megabyte)", "1 Byte"],
                correct: 1
            },
            {
                question: "Windows, macOS ve Linux hangi yazılım türüne örnektir?",
                options: ["Ofis Programı", "İşletim Sistemi", "Oyun", "Tarayıcı"],
                correct: 1
            },
            {
                question: "En küçük veri birimi hangisidir?",
                options: ["Byte", "Bit", "Kilobyte", "Megabyte"],
                correct: 1
            },
            {
                question: "Hangi cihaz girdi cihazı değildir?",
                options: ["Klavye", "Mouse", "Monitör", "Mikrofon"],
                correct: 2
            },
            {
                question: "HDD'ye göre SSD'nin avantajı nedir?",
                options: ["Daha ucuz", "Daha hızlı", "Daha fazla depolama", "Daha eski teknoloji"],
                correct: 1
            },
            {
                question: "Dosyaları organize etmek için kullanılan dijital kapsayıcıya ne denir?",
                options: ["Klasör", "Windows", "Dosya", "Program"],
                correct: 0
            },
            {
                question: "USB'nin açılımı nedir?",
                options: ["United System Bus", "Universal Serial Bus", "Unique Storage Box", "Ultra Speed Band"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswers = [];

        function init() {
            renderQuestion();
        }

        function renderQuestion() {
            const quizContent = document.getElementById('quizContent');
            quizContent.innerHTML = '';

            const questionData = quizData[currentQuestion];
            const questionCard = document.createElement('div');
            questionCard.className = 'question-card active';

            questionCard.innerHTML = `
                <div class="question-number">Soru ${currentQuestion + 1}/${quizData.length}</div>
                <div class="question-text">${questionData.question}</div>
                <div class="options" id="options">
                    ${questionData.options.map((option, index) => `
                        <div class="option" onclick="selectOption(${index})" data-index="${index}">
                            ${String.fromCharCode(65 + index)}. ${option}
                        </div>
                    `).join('')}
                </div>
                <div class="controls">
                    <button class="btn btn-secondary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>⬅️ Önceki</button>
                    <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn">Sonraki ➡️</button>
                </div>
            `;

            quizContent.appendChild(questionCard);
            updateProgress();
        }

        function selectOption(index) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[index].classList.add('selected');
            selectedAnswers[currentQuestion] = index;
        }

        function nextQuestion() {
            if (selectedAnswers[currentQuestion] === undefined) {
                alert('Lütfen bir seçenek seçin!');
                return;
            }

            checkAnswer();

            if (currentQuestion < quizData.length - 1) {
                setTimeout(() => {
                    currentQuestion++;
                    renderQuestion();
                }, 1000);
            } else {
                setTimeout(showResults, 1000);
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function checkAnswer() {
            const options = document.querySelectorAll('.option');
            const userAnswer = selectedAnswers[currentQuestion];
            const correctAnswer = quizData[currentQuestion].correct;

            if (userAnswer === correctAnswer) {
                options[userAnswer].classList.add('correct');
                score++;
            } else {
                options[userAnswer].classList.add('wrong');
                options[correctAnswer].classList.add('correct');
            }

            options.forEach(opt => opt.style.pointerEvents = 'none');
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('resultCard').classList.add('active');

            const percentage = Math.round((score / quizData.length) * 100);

            document.getElementById('resultScore').textContent = `${score}/${quizData.length}`;
            document.getElementById('correctCount').textContent = score;
            document.getElementById('wrongCount').textContent = quizData.length - score;
            document.getElementById('percentageScore').textContent = percentage + '%';

            let message = '';
            if (percentage >= 90) {
                message = '🎖️ Mükemmel! Bilişim Temelleri konusunda uzman oldun!';
            } else if (percentage >= 70) {
                message = '👍 Harika! Konuyu çok iyi öğrenmişsin!';
            } else if (percentage >= 50) {
                message = '😊 İyi! Biraz daha çalışırsan mükemmel olacak!';
            } else {
                message = '📚 Tekrar çalışmalısın. Sözlüğü incelemeyi unutma!';
            }

            document.getElementById('resultMessage').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            selectedAnswers = [];
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('resultCard').classList.remove('active');
            renderQuestion();
        }

        init();
    </script>
</body>
</html>
