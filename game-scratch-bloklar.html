<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Scratch Blokları - Doğru Yanlış Oyunu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #667eea; margin-bottom: 30px; font-size: 2.5em; }
        .question {
            background: #f0f2ff;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 1.4em;
            text-align: center;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .answer-btn {
            padding: 20px 60px;
            font-size: 1.5em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .true-btn {
            background: #4caf50;
            color: white;
        }
        .false-btn {
            background: #f44336;
            color: white;
        }
        .answer-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .score {
            text-align: center;
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .feedback {
            text-align: center;
            font-size: 1.3em;
            min-height: 40px;
            font-weight: bold;
        }
        .correct-feedback { color: #4caf50; }
        .incorrect-feedback { color: #f44336; }
        .reset-btn {
            display: block;
            margin: 20px auto 0;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
        }
        .reset-btn:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>💻 Scratch Blokları - Doğru mu Yanlış mı?</h1>
        <div class="score" id="score">Skor: 0 / 0</div>
        <div class="question" id="question"></div>
        <div class="buttons">
            <button class="answer-btn true-btn" onclick="checkAnswer(true)">✓ DOĞRU</button>
            <button class="answer-btn false-btn" onclick="checkAnswer(false)">✗ YANLIŞ</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="reset-btn" onclick="window.location.href='index.html'">🏠 Ana Sayfaya Dön</button>
    </div>
    <script>
        const questions = [
            { text: "Scratch blok tabanlı bir programlama dilidir.", answer: true },
            { text: "Scratch'te yeşil bayrak programı durdurur.", answer: false },
            { text: "Scratch MIT tarafından geliştirilmiştir.", answer: true },
            { text: "Scratch sadece İngilizce dilinde kullanılabilir.", answer: false },
            { text: "Sprite, Scratch'te karakterlere verilen isimdir.", answer: true },
            { text: "Döngü blokları bir işi tekrar tekrar yapar.", answer: true },
            { text: "Scratch ile sadece oyun yapılabilir.", answer: false },
            { text: "Koşul blokları 'eğer-o zaman' mantığıyla çalışır.", answer: true },
            { text: "Scratch ücretli bir programdır.", answer: false },
            { text: "Bloklar yukarıdan aşağıya doğru çalışır.", answer: true }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = 0;

        function showQuestion() {
            if (currentIndex >= questions.length) {
                document.getElementById('question').textContent = `🎉 Oyun Bitti! ${score}/${questions.length} doğru!`;
                document.querySelector('.buttons').style.display = 'none';
                return;
            }
            
            document.getElementById('question').textContent = questions[currentIndex].text;
            document.getElementById('feedback').textContent = '';
        }

        function checkAnswer(userAnswer) {
            const correct = questions[currentIndex].answer === userAnswer;
            answered++;
            
            if (correct) {
                score++;
                document.getElementById('feedback').textContent = '✅ Doğru!';
                document.getElementById('feedback').className = 'feedback correct-feedback';
            } else {
                document.getElementById('feedback').textContent = '❌ Yanlış!';
                document.getElementById('feedback').className = 'feedback incorrect-feedback';
            }
            
            document.getElementById('score').textContent = `Skor: ${score} / ${answered}`;
            
            setTimeout(() => {
                currentIndex++;
                showQuestion();
            }, 1500);
        }

        showQuestion();
    </script>
</body>
</html>
