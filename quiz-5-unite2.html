<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5. Sınıf Ünite 2 Quiz - Dijital Ürün Tasarımı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #d57eeb;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="quiz-container" style="text-align: center; padding: 60px 40px;">
        <h1>🎨 Dijital Ürün Tasarımı Quiz</h1>
        <p class="subtitle">5. Sınıf - Ünite 2 | 10 Soru</p>

        <div id="quiz-container" style="margin-top: 40px;">
            <p style="color: #999; font-style: italic;">Quiz yükleniyor...</p>
        </div>
    </div>

    <!-- JavaScript modülleri -->
    <script src="scripts/storage.js"></script>
    <script src="scripts/analytics.js"></script>
    <script src="scripts/badge-system.js"></script>
    <script src="scripts/quiz-engine.js"></script>

    <script>
        // Quiz verisi
        const quizData = {
            title: "5. Sınıf Ünite 2 - Dijital Ürün Tasarımı",
            shuffle: false,
            timerEnabled: false,
            pointsPerQuestion: 10,
            questions: [
                {
                    question: "Microsoft Word hangi tür belgeler hazırlamak için kullanılır?",
                    options: ["Resim", "Metin belgeleri", "Video", "Müzik"],
                    correct: 1
                },
                {
                    question: "Word'de yazı biçimlendirmek için aşağıdakilerden hangisi YAPILMAZ?",
                    options: ["Yazı tipi değiştirme", "Yazı boyutu ayarlama", "Yazı rengini değiştirme", "Video çekme"],
                    correct: 3
                },
                {
                    question: "Paint programında serbest çizim yapmak için hangi araç kullanılır?",
                    options: ["Dolgu", "Fırça", "Şekiller", "Metin"],
                    correct: 1
                },
                {
                    question: "Alanları renklendirmek için Paint'te hangi araç kullanılır?",
                    options: ["Fırça", "Dolgu", "Kalem", "Silgi"],
                    correct: 1
                },
                {
                    question: "PowerPoint ile ne yapılır?",
                    options: ["Müzik dinleme", "Slayt gösterisi hazırlama", "Oyun oynama", "İnternet gezme"],
                    correct: 1
                },
                {
                    question: "İyi bir PowerPoint sunumunun özelliği hangisidir?",
                    options: ["Çok fazla yazı", "Küçük yazılar", "Sade ve görsel ağırlıklı", "Renklerle abartı"],
                    correct: 2
                },
                {
                    question: "Word'de tablo oluşturmanın amacı nedir?",
                    options: ["Oyun oynamak", "Bilgileri düzenli sunmak", "Resim çizmek", "Müzik yapmak"],
                    correct: 1
                },
                {
                    question: "Aşağıdakilerden hangisi Paint'te ÇİZİLEMEZ?",
                    options: ["Daire", "Kare", "Üçgen", "3D Animasyon"],
                    correct: 3
                },
                {
                    question: "PowerPoint'te slaytlar arası geçişlerde ne yapılmalı?",
                    options: ["Abartılı efektler kullan", "Abartısız kullan", "Hiç kullanma", "Her slayta farklı renk"],
                    correct: 1
                },
                {
                    question: "Dijital ürün tasarımında en önemli kural nedir?",
                    options: ["Karışık olsun", "Sade ve anlaşılır olsun", "Çok renkli olsun", "Yazı çok olsun"],
                    correct: 1
                }
            ]
        };

        // Quiz'i başlat
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof QuizEngine !== 'undefined' && QuizEngine.validateQuizData(quizData)) {
                QuizEngine.initQuiz(quizData);
            } else {
                document.getElementById('quiz-container').innerHTML =
                    '<p style="color: #e74c3c;">Quiz yüklenirken hata oluştu. Lütfen sayfayı yenileyin.</p>';
            }
        });
    </script>
</body>
</html>
