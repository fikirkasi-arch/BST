<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Ürün Tasarım Simülasyonu - 5. Sınıf Ünite 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #fa709a; margin-bottom: 20px; }
        .progress-bar {
            background: #e0e0e0;
            height: 12px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #fa709a 0%, #fee140 100%);
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .step {
            text-align: center;
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            background: #f5f5f5;
            margin: 0 5px;
            opacity: 0.5;
        }
        .step.active {
            opacity: 1;
            background: linear-gradient(135deg, #fa709a15 0%, #fee14015 100%);
            border: 2px solid #fa709a;
        }
        .step.completed {
            opacity: 1;
            background: #d4edda;
        }
        .project-workspace {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 15px;
            min-height: 400px;
        }
        .project-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
        }
        .project-desc {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        .choice-card {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .choice-card:hover {
            border-color: #fa709a;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(250, 112, 154, 0.3);
        }
        .choice-card.selected {
            border-color: #fa709a;
            background: linear-gradient(135deg, #fa709a15 0%, #fee14015 100%);
        }
        .choice-card.correct {
            border-color: #28a745;
            background: #d4edda;
        }
        .choice-card.wrong {
            border-color: #dc3545;
            background: #f8d7da;
        }
        .choice-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .choice-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .choice-desc {
            font-size: 0.9em;
            color: #666;
        }
        .btn {
            padding: 15px 35px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .feedback {
            background: #fff3cd;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #ffc107;
            display: none;
        }
        .project-summary {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid #e0e0e0;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Dijital Ürün Tasarım Simülasyonu</h1>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step0">1️⃣ Ürün Türü</div>
            <div class="step" id="step1">2️⃣ Hedef Kitle</div>
            <div class="step" id="step2">3️⃣ Araçlar</div>
            <div class="step" id="step3">4️⃣ Tasarım</div>
            <div class="step" id="step4">5️⃣ Test</div>
        </div>

        <div class="project-workspace" id="workspace"></div>

        <div style="text-align: center;">
            <button class="btn" id="nextBtn" onclick="nextStep()" disabled>➡️ Sonraki Adım</button>
            <button class="btn" id="finishBtn" onclick="finishProject()" style="display: none;">🎉 Projeyi Tamamla</button>
        </div>
    </div>

    <script>
        const steps = [
            {
                title: 'Adım 1: Dijital Ürün Türü Seç',
                desc: 'Hangi tür bir dijital ürün tasarlamak istiyorsun?',
                choices: [
                    { icon: '📱', title: 'Mobil Uygulama', desc: 'Telefon için uygulama', value: 'mobile' },
                    { icon: '🌐', title: 'Web Sitesi', desc: 'İnternet sitesi', value: 'website' },
                    { icon: '🎮', title: 'Oyun', desc: 'Dijital oyun', value: 'game' },
                    { icon: '🎬', title: 'Video İçerik', desc: 'Eğitim videosu', value: 'video' }
                ],
                correctAnswer: null
            },
            {
                title: 'Adım 2: Hedef Kitle Belirle',
                desc: 'Ürününüz kimin için tasarlanacak?',
                choices: [
                    { icon: '👦', title: 'Çocuklar', desc: '7-12 yaş arası', value: 'kids' },
                    { icon: '👨‍🎓', title: 'Öğrenciler', desc: 'Ortaokul-Lise', value: 'students' },
                    { icon: '👨‍💼', title: 'Yetişkinler', desc: 'İş dünyası', value: 'adults' },
                    { icon: '👴', title: 'Yaşlılar', desc: '60+ yaş', value: 'seniors' }
                ],
                correctAnswer: null
            },
            {
                title: 'Adım 3: Kullanılacak Araçları Seç',
                desc: 'Projenizde hangi programları kullanacaksınız? (Birden fazla seçebilirsiniz)',
                choices: [
                    { icon: '📝', title: 'Word', desc: 'Metin belgeleri', value: 'word', correct: true },
                    { icon: '📊', title: 'PowerPoint', desc: 'Sunum hazırlama', value: 'powerpoint', correct: true },
                    { icon: '🎨', title: 'Paint', desc: 'Görsel tasarım', value: 'paint', correct: true },
                    { icon: '🔧', title: 'Not Defteri', desc: 'Basit metin', value: 'notepad', correct: false }
                ],
                correctAnswer: ['word', 'powerpoint', 'paint'],
                multiSelect: true
            },
            {
                title: 'Adım 4: Tasarım Prensiplerini Uygula',
                desc: 'İyi bir dijital ürün için hangi özelliklere dikkat etmelisin? (Birden fazla seçebilirsiniz)',
                choices: [
                    { icon: '👁️', title: 'Görsel Çekicilik', desc: 'Güzel ve düzenli görünüm', value: 'visual', correct: true },
                    { icon: '🎯', title: 'Kullanım Kolaylığı', desc: 'Basit ve anlaşılır', value: 'usability', correct: true },
                    { icon: '⚡', title: 'Hız', desc: 'Hızlı çalışma', value: 'speed', correct: true },
                    { icon: '💰', title: 'Pahalı Olması', desc: 'Yüksek fiyat', value: 'expensive', correct: false }
                ],
                correctAnswer: ['visual', 'usability', 'speed'],
                multiSelect: true
            },
            {
                title: 'Adım 5: Test ve Geri Bildirim',
                desc: 'Ürününüzü test etmek için ne yapmalısınız? (Birden fazla seçebilirsiniz)',
                choices: [
                    { icon: '👥', title: 'Kullanıcı Testi', desc: 'Hedef kitleyle test et', value: 'user-test', correct: true },
                    { icon: '📝', title: 'Geri Bildirim Al', desc: 'Görüşleri topla', value: 'feedback', correct: true },
                    { icon: '🔄', title: 'Düzelt ve İyileştir', desc: 'Sorunları çöz', value: 'improve', correct: true },
                    { icon: '🚫', title: 'Test Etme', desc: 'Direkt yayınla', value: 'no-test', correct: false }
                ],
                correctAnswer: ['user-test', 'feedback', 'improve'],
                multiSelect: true
            }
        ];

        let currentStep = 0;
        let projectData = {};
        let selectedChoices = [];

        function loadStep() {
            const step = steps[currentStep];
            const workspace = document.getElementById('workspace');

            document.getElementById('progress').style.width = ((currentStep / steps.length) * 100) + '%';

            for (let i = 0; i < steps.length; i++) {
                const stepEl = document.getElementById('step' + i);
                if (i < currentStep) {
                    stepEl.className = 'step completed';
                } else if (i === currentStep) {
                    stepEl.className = 'step active';
                } else {
                    stepEl.className = 'step';
                }
            }

            workspace.innerHTML = `
                <div class="project-title">${step.title}</div>
                <div class="project-desc">${step.desc}</div>
                <div class="choice-grid" id="choiceGrid"></div>
                <div class="feedback" id="feedback"></div>
            `;

            const grid = document.getElementById('choiceGrid');
            step.choices.forEach((choice, i) => {
                const card = document.createElement('div');
                card.className = 'choice-card';
                card.innerHTML = `
                    <div class="choice-icon">${choice.icon}</div>
                    <div class="choice-title">${choice.title}</div>
                    <div class="choice-desc">${choice.desc}</div>
                `;
                card.onclick = () => selectChoice(i, choice);
                grid.appendChild(card);
            });

            selectedChoices = [];
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('finishBtn').style.display = 'none';
        }

        function selectChoice(index, choice) {
            const step = steps[currentStep];
            const cards = document.querySelectorAll('.choice-card');

            if (step.multiSelect) {
                if (selectedChoices.includes(choice.value)) {
                    selectedChoices = selectedChoices.filter(v => v !== choice.value);
                    cards[index].classList.remove('selected');
                } else {
                    selectedChoices.push(choice.value);
                    cards[index].classList.add('selected');
                }
                document.getElementById('nextBtn').disabled = selectedChoices.length === 0;
            } else {
                cards.forEach(c => c.classList.remove('selected'));
                cards[index].classList.add('selected');
                selectedChoices = [choice.value];
                document.getElementById('nextBtn').disabled = false;
            }

            const stepKey = ['productType', 'targetAudience', 'tools', 'designPrinciples', 'testing'][currentStep];
            projectData[stepKey] = step.multiSelect ? [...selectedChoices] : selectedChoices[0];
        }

        function nextStep() {
            const step = steps[currentStep];

            if (step.correctAnswer && step.multiSelect) {
                const cards = document.querySelectorAll('.choice-card');
                let allCorrect = true;

                step.choices.forEach((choice, i) => {
                    if (choice.correct) {
                        if (!selectedChoices.includes(choice.value)) {
                            allCorrect = false;
                            cards[i].classList.add('correct');
                        }
                    }
                });

                selectedChoices.forEach(value => {
                    const choiceIndex = step.choices.findIndex(c => c.value === value);
                    const choice = step.choices[choiceIndex];
                    if (!choice.correct) {
                        allCorrect = false;
                        cards[choiceIndex].classList.add('wrong');
                    } else {
                        cards[choiceIndex].classList.add('correct');
                    }
                });

                if (!allCorrect) {
                    const feedback = document.getElementById('feedback');
                    feedback.innerHTML = `
                        <h3 style="color: #dc3545; margin-bottom: 10px;">❌ Eksik veya yanlış seçimler var!</h3>
                        <p><strong>Doğru seçenekler:</strong></p>
                        <ul style="margin-top: 10px;">
                            ${step.choices.filter(c => c.correct).map(c => `<li>${c.icon} ${c.title}</li>`).join('')}
                        </ul>
                    `;
                    feedback.style.display = 'block';
                    document.getElementById('nextBtn').textContent = '🔄 Tekrar Dene';
                    document.getElementById('nextBtn').onclick = () => {
                        selectedChoices = [];
                        loadStep();
                    };
                    return;
                }
            }

            currentStep++;
            if (currentStep < steps.length) {
                loadStep();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById('progress').style.width = '100%';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('finishBtn').style.display = 'inline-block';

            const workspace = document.getElementById('workspace');
            const productTypeNames = {
                mobile: 'Mobil Uygulama',
                website: 'Web Sitesi',
                game: 'Oyun',
                video: 'Video İçerik'
            };
            const audienceNames = {
                kids: 'Çocuklar (7-12 yaş)',
                students: 'Öğrenciler',
                adults: 'Yetişkinler',
                seniors: 'Yaşlılar (60+)'
            };

            workspace.innerHTML = `
                <div class="project-title">🎉 Proje Özeti</div>
                <div class="project-desc">Dijital ürün tasarım projeniz tamamlandı!</div>

                <div class="project-summary">
                    <div class="summary-item">
                        <strong>Ürün Türü:</strong>
                        <span>${productTypeNames[projectData.productType]}</span>
                    </div>
                    <div class="summary-item">
                        <strong>Hedef Kitle:</strong>
                        <span>${audienceNames[projectData.targetAudience]}</span>
                    </div>
                    <div class="summary-item">
                        <strong>Kullanılan Araçlar:</strong>
                        <span>${projectData.tools.length} araç seçildi</span>
                    </div>
                    <div class="summary-item">
                        <strong>Tasarım Prensipleri:</strong>
                        <span>${projectData.designPrinciples.length} prensip uygulandı</span>
                    </div>
                    <div class="summary-item">
                        <strong>Test Yöntemleri:</strong>
                        <span>${projectData.testing.length} test yapıldı</span>
                    </div>
                </div>

                <div style="background: linear-gradient(135deg, #fa709a15 0%, #fee14015 100%); padding: 25px; border-radius: 15px; margin-top: 20px; border-left: 5px solid #fa709a;">
                    <h3 style="color: #fa709a; margin-bottom: 15px;">💡 Öğrendikleriniz</h3>
                    <ul style="line-height: 2; color: #666;">
                        <li>✅ Dijital ürün tasarımı adım adım yapılır</li>
                        <li>✅ Hedef kitle analizi çok önemlidir</li>
                        <li>✅ Doğru araçları seçmek gerekir (Word, PowerPoint, Paint)</li>
                        <li>✅ Tasarımda görsellik, kullanım kolaylığı ve hız önemlidir</li>
                        <li>✅ Test ve geri bildirim olmadan ürün yayınlanmamalı</li>
                        <li>✅ Kullanıcı deneyimi (UX) her şeyden önemlidir</li>
                    </ul>
                </div>
            `;
        }

        function finishProject() {
            if (confirm('Tebrikler! Projeyi tamamladınız. Yeniden başlamak ister misiniz?')) {
                location.reload();
            }
        }

        loadStep();
    </script>
</body>
</html>
