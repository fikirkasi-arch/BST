<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kod Hata Avcısı - 6. Sınıf Ünite 5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-family: 'Segoe UI', sans-serif;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        .code-editor {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 1.05em;
            line-height: 1.6;
            overflow-x: auto;
        }
        .code-line {
            display: flex;
            padding: 3px 0;
        }
        .line-number {
            color: #858585;
            margin-right: 20px;
            user-select: none;
            min-width: 30px;
            text-align: right;
        }
        .code-content {
            flex: 1;
        }
        .error-line {
            background: rgba(255, 0, 0, 0.2);
            cursor: pointer;
            padding: 3px 5px;
            margin: -3px -5px;
            border-radius: 3px;
        }
        .error-line:hover {
            background: rgba(255, 0, 0, 0.3);
        }
        .error-line.found {
            background: rgba(0, 255, 0, 0.2);
        }
        .keyword { color: #569cd6; }
        .string { color: #ce9178; }
        .number { color: #b5cea8; }
        .comment { color: #6a9955; font-style: italic; }
        .function { color: #dcdcaa; }
        .problem-desc {
            background: #fff3cd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #ffc107;
            font-family: 'Segoe UI', sans-serif;
        }
        .error-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .error-option {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .error-option:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .error-option.selected {
            border-color: #667eea;
            background: #e7e9fc;
        }
        .error-option.correct {
            border-color: #28a745;
            background: #d4edda;
        }
        .error-option.wrong {
            border-color: #dc3545;
            background: #f8d7da;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 5px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .feedback {
            background: #e7f3ff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #667eea;
            display: none;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐛 Kod Hata Avcısı</h1>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="bugs-found">0</div>
                <div>🐛 Bulunan Hatalar</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="level">1</div>
                <div>📊 Seviye</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-bugs">5</div>
                <div>🎯 Toplam Hata</div>
            </div>
        </div>

        <div id="content"></div>
    </div>

    <script>
        const bugs = [
            {
                title: 'Python - Değişken Hatası',
                desc: 'Bu kod yaş hesaplama yapmaya çalışıyor ama hata veriyor. Hatayı bulun!',
                language: 'Python',
                code: [
                    'dogum_yili = 2010',
                    'su_anki_yil = 2024',
                    'yas = su_anki_yil - dogum_yili',
                    'print("Yaşınız: " + yas)'  // HATA: str + int birleştirilemez
                ],
                errorLine: 3,
                options: [
                    { text: 'dogum_yili değişkeni tanımlanmamış', correct: false },
                    { text: 'print() fonksiyonu yanlış yazılmış', correct: false },
                    { text: 'String ile integer toplanamaz, str(yas) yapmalı', correct: true },
                    { text: 'Parantez eksik', correct: false }
                ],
                explanation: '✅ Python\'da string ile integer toplanamaz. Çözüm: print("Yaşınız: " + str(yas)) veya print(f"Yaşınız: {yas}")'
            },
            {
                title: 'Python - Liste İndex Hatası',
                desc: 'Meyve listesinden eleman yazdırmaya çalışıyor ama program hata veriyor.',
                language: 'Python',
                code: [
                    'meyveler = ["elma", "armut", "muz"]',
                    'print(meyveler[0])',
                    'print(meyveler[1])',
                    'print(meyveler[3])'  // HATA: Index 3 yok (0,1,2 var)
                ],
                errorLine: 3,
                options: [
                    { text: 'Liste boş olduğu için hata veriyor', correct: false },
                    { text: 'Index 3 yok, listede 0-2 arası index var', correct: true },
                    { text: 'print() yanlış kullanılmış', correct: false },
                    { text: 'Liste tanımı yanlış', correct: false }
                ],
                explanation: '✅ Listede 3 eleman var: index 0, 1, 2. Index 3 yok! Python listeleri 0\'dan başlar.'
            },
            {
                title: 'Scratch - Sonsuz Döngü',
                desc: 'Kedi 10 kere "Merhaba" demesi gerekiyor ama sürekli söylüyor.',
                language: 'Scratch',
                code: [
                    '🏁 Yeşil bayrak tıklandığında',
                    '🔄 sürekli',  // HATA: "sürekli" yerine "10 kere tekrarla" olmalı
                    '   💬 "Merhaba" de'
                ],
                errorLine: 1,
                options: [
                    { text: 'Yeşil bayrak bloğu eksik', correct: false },
                    { text: '"sürekli" yerine "10 kere tekrarla" kullanılmalı', correct: true },
                    { text: '"de" bloğu yanlış', correct: false },
                    { text: 'Girinti hatası var', correct: false }
                ],
                explanation: '✅ "sürekli" bloğu sonsuz döngü yaratır. 10 kere tekrar için "10 kere tekrarla" bloğu kullanılmalı.'
            },
            {
                title: 'Python - Girintileme Hatası',
                desc: 'Çift sayıları yazdırmaya çalışıyor ama Python hata veriyor.',
                language: 'Python',
                code: [
                    'for i in range(10):',
                    'if i % 2 == 0:',  // HATA: Girintileme eksik
                    '    print(i)'
                ],
                errorLine: 1,
                options: [
                    { text: 'range() fonksiyonu yanlış', correct: false },
                    { text: 'if satırı girintilenmemiş (4 boşluk olmalı)', correct: true },
                    { text: '% operatörü yanlış', correct: false },
                    { text: 'print() içi yanlış', correct: false }
                ],
                explanation: '✅ Python\'da if bloğu for döngüsünün içindeyse girintilenmeli. Doğrusu: "    if i % 2 == 0:"'
            },
            {
                title: 'Scratch - Koşul Hatası',
                desc: 'Kedi duvara çarpınca yön değiştirmeli ama sürekli dönüyor.',
                language: 'Scratch',
                code: [
                    '🏁 Yeşil bayrak tıklandığında',
                    '🔄 sürekli',
                    '   🚀 10 adım git',
                    '   ↩️ kenara değersen, sek'  // HATA: Her zaman döner, "eğer" koşulu yok
                ],
                errorLine: 3,
                options: [
                    { text: 'Adım sayısı yanlış', correct: false },
                    { text: '"kenara değersen sek" her zaman çalışır, "eğer kenara değiyorsa" koşulu olmalı', correct: true },
                    { text: 'Sürekli bloğu yanlış', correct: false },
                    { text: 'Yeşil bayrak eksik', correct: false }
                ],
                explanation: '✅ "sek" bloğu koşulsuz her zaman çalışıyor. "eğer kenara değiyorsa" koşuluyla kullanılmalı.'
            }
        ];

        let currentBug = 0;
        let bugsFound = 0;
        let selectedOption = null;

        function loadBug() {
            if (currentBug >= bugs.length) {
                showResults();
                return;
            }

            const bug = bugs[currentBug];
            document.getElementById('level').textContent = currentBug + 1;
            selectedOption = null;

            let codeHTML = '';
            bug.code.forEach((line, i) => {
                const isError = i === bug.errorLine;
                codeHTML += `<div class="code-line">
                    <span class="line-number">${i + 1}</span>
                    <span class="code-content ${isError ? 'error-line' : ''}" ${isError ? 'id="error-line"' : ''}>
                        ${highlightSyntax(line, bug.language)}
                    </span>
                </div>`;
            });

            document.getElementById('content').innerHTML = `
                <div class="problem-desc">
                    <h3 style="color: #333; margin-bottom: 10px;">🎯 ${bug.title}</h3>
                    <p style="font-size: 1.05em; color: #666;">${bug.desc}</p>
                    <div style="margin-top: 10px; color: #856404;">
                        <strong>💻 Dil:</strong> ${bug.language}
                    </div>
                </div>

                <div class="code-editor">
                    ${codeHTML}
                </div>

                <h3 style="margin: 20px 0; color: #333; font-family: Segoe UI;">🔍 Hata nerede ve neden?</h3>

                <div class="error-options" id="options">
                    ${bug.options.map((opt, i) => `
                        <div class="error-option" onclick="selectOption(${i})">
                            <div style="font-weight: bold; color: #333; margin-bottom: 5px;">
                                ${String.fromCharCode(65 + i)})
                            </div>
                            <div style="color: #666;">${opt.text}</div>
                        </div>
                    `).join('')}
                </div>

                <div class="feedback" id="feedback"></div>

                <div style="text-align: center;">
                    <button class="btn" id="checkBtn" onclick="checkAnswer()" disabled>✅ Kontrol Et</button>
                    <button class="btn" id="nextBtn" onclick="nextBug()" style="display: none;">➡️ Sonraki Hata</button>
                </div>
            `;
        }

        function highlightSyntax(code, language) {
            if (language === 'Python') {
                return code
                    .replace(/(for|if|in|range|def|print|import)/g, '<span class="keyword">$1</span>')
                    .replace(/(".*?")/g, '<span class="string">$1</span>')
                    .replace(/\b(\d+)\b/g, '<span class="number">$1</span>')
                    .replace(/(#.*)/g, '<span class="comment">$1</span>');
            } else if (language === 'Scratch') {
                return code;
            }
            return code;
        }

        function selectOption(index) {
            if (document.getElementById('feedback').style.display === 'block') return;

            selectedOption = index;
            const options = document.querySelectorAll('.error-option');
            options.forEach((opt, i) => {
                opt.classList.toggle('selected', i === index);
            });
            document.getElementById('checkBtn').disabled = false;
        }

        function checkAnswer() {
            const bug = bugs[currentBug];
            const isCorrect = bug.options[selectedOption].correct;
            const options = document.querySelectorAll('.error-option');

            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (bug.options[i].correct) {
                    opt.classList.add('correct');
                } else if (i === selectedOption) {
                    opt.classList.add('wrong');
                }
            });

            if (isCorrect) {
                bugsFound++;
                document.getElementById('bugs-found').textContent = bugsFound;
                document.getElementById('error-line').classList.add('found');
            }

            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.innerHTML = `
                <h3 style="color: ${isCorrect ? '#28a745' : '#dc3545'}; margin-bottom: 10px;">
                    ${isCorrect ? '✅ Doğru! Hatayı buldun!' : '❌ Yanlış cevap!'}
                </h3>
                <p style="font-size: 1.05em; line-height: 1.6;">
                    ${bug.explanation}
                </p>
            `;
            feedbackDiv.style.display = 'block';

            document.getElementById('checkBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function nextBug() {
            currentBug++;
            loadBug();
        }

        function showResults() {
            const percentage = Math.round((bugsFound / bugs.length) * 100);
            let message, emoji;

            if (percentage >= 80) {
                message = 'Muhteşemsin! Profesyonel hata avcısı oldun!';
                emoji = '🏆';
            } else if (percentage >= 60) {
                message = 'İyi iş! Hata bulma becerin gelişiyor.';
                emoji = '👍';
            } else {
                message = 'Daha fazla pratik yapmalısın!';
                emoji = '📚';
            }

            document.getElementById('content').innerHTML = `
                <div style="text-align: center; padding: 40px; font-family: Segoe UI;">
                    <div style="font-size: 6em;">${emoji}</div>
                    <h2 style="color: #667eea; margin: 20px 0;">${message}</h2>
                    <div style="font-size: 3em; font-weight: bold; color: #667eea; margin: 20px 0;">
                        ${bugsFound}/${bugs.length} Hata Bulundu
                    </div>
                    <div style="font-size: 2em; font-weight: bold; color: #764ba2;">
                        %${percentage} Başarı
                    </div>

                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; margin-top: 30px; text-align: left;">
                        <h3 style="margin-bottom: 15px;">🐛 Hata Ayıklama İpuçları:</h3>
                        <ul style="line-height: 2;">
                            <li>📖 Hata mesajlarını dikkatlice oku</li>
                            <li>🔍 Satır satır kodu kontrol et</li>
                            <li>🎯 Değişken isimlerini kontrol et</li>
                            <li>📐 Girintilemeyi (indentation) kontrol et</li>
                            <li>🔢 Veri tiplerini kontrol et (str, int, float)</li>
                            <li>📋 Liste/array indekslerini kontrol et</li>
                            <li>🔄 Döngü koşullarını kontrol et</li>
                            <li>🧪 Küçük parçalar halinde test et</li>
                        </ul>
                    </div>

                    <div style="background: #e7f3ff; padding: 25px; border-radius: 15px; margin-top: 20px; text-align: left;">
                        <h3 style="color: #333; margin-bottom: 15px;">💡 Yaygın Hata Türleri:</h3>
                        <div style="line-height: 2;">
                            <strong>1. Sözdizimi Hatası (Syntax Error):</strong> Kod yazım kurallarına uymamış<br>
                            <strong>2. İsim Hatası (Name Error):</strong> Tanımlanmamış değişken kullanılmış<br>
                            <strong>3. Tip Hatası (Type Error):</strong> Veri tipleri uyumsuz<br>
                            <strong>4. Index Hatası (Index Error):</strong> Olmayan liste elemanına erişim<br>
                            <strong>5. Mantık Hatası (Logic Error):</strong> Kod çalışır ama sonuç yanlış
                        </div>
                    </div>

                    <button class="btn" onclick="location.reload()" style="margin-top: 30px;">🔄 Tekrar Oyna</button>
                </div>
            `;
        }

        // İlk hatayı yükle
        loadBug();
    </script>
</body>
</html>
