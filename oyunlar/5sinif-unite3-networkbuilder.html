<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ağ Oluşturucu - 5. Sınıf Ünite 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #4facfe; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; }
        .instructions {
            background: #e0f7ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #4facfe;
        }
        .challenge {
            background: #fff9e6;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
        }
        .game-area {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .devices-panel {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }
        .device {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .device:hover {
            border-color: #4facfe;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }
        .device.selected {
            border-color: #4facfe;
            background: #e0f7ff;
        }
        .device-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }
        .canvas-area {
            background: #fafafa;
            border-radius: 10px;
            padding: 20px;
            min-height: 500px;
            position: relative;
            border: 2px dashed #d0d0d0;
        }
        .placed-device {
            position: absolute;
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #4facfe;
            cursor: move;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 80px;
        }
        .placed-device-icon {
            font-size: 2.5em;
        }
        .placed-device-label {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        .connection {
            position: absolute;
            height: 3px;
            background: #4facfe;
            transform-origin: left center;
            pointer-events: none;
        }
        .connection.correct {
            background: #43e97b;
        }
        .connection.wrong {
            background: #f5576c;
        }
        .buttons {
            text-align: center;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 1.8em; font-weight: bold; color: #4facfe; }
        .stat-label { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Ağ Oluşturucu</h1>
        <p class="subtitle">5. Sınıf - Ünite 3: Ağlar ve İletişim</p>

        <div class="instructions">
            <strong>🎯 Görev:</strong> Bilgisayarları ve cihazları sürükleyerek bir ağ oluşturun. Router'a tüm cihazları bağlayın!
        </div>

        <div class="challenge" id="challenge">
            📌 Hedef: 4 bilgisayarı ve 2 yazıcıyı router'a bağlayın
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="deviceCount">0/7</div>
                <div class="stat-label">Yerleştiril Cihaz</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="connectionCount">0/6</div>
                <div class="stat-label">Bağlantı</div>
            </div>
        </div>

        <div class="game-area">
            <div class="devices-panel">
                <h3 style="margin-bottom: 15px; color: #333;">Cihazlar</h3>
                <div class="device" onclick="addDevice('router', '🌐', 'Router')">
                    <div class="device-icon">🌐</div>
                    <div>Router</div>
                </div>
                <div class="device" onclick="addDevice('computer', '💻', 'Bilgisayar')">
                    <div class="device-icon">💻</div>
                    <div>Bilgisayar</div>
                </div>
                <div class="device" onclick="addDevice('printer', '🖨️', 'Yazıcı')">
                    <div class="device-icon">🖨️</div>
                    <div>Yazıcı</div>
                </div>
                <div class="device" onclick="addDevice('phone', '📱', 'Telefon')">
                    <div class="device-icon">📱</div>
                    <div>Telefon</div>
                </div>
                <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="clearCanvas()">🗑️ Temizle</button>
            </div>

            <div class="canvas-area" id="canvas" onclick="canvasClick(event)"></div>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="checkNetwork()">✅ Ağı Kontrol Et</button>
            <button class="btn btn-primary" onclick="autoComplete()">💡 İpucu</button>
            <button class="btn btn-secondary" onclick="window.location.href='../index.html'">🏠 Ana Sayfa</button>
        </div>
    </div>

    <script>
        let devices = [];
        let connections = [];
        let deviceCounter = 0;
        let selectedDevice = null;

        function addDevice(type, icon, label) {
            const canvas = document.getElementById('canvas');
            const device = document.createElement('div');
            device.className = 'placed-device';
            device.id = `device-${deviceCounter}`;
            device.dataset.type = type;
            device.style.left = (Math.random() * (canvas.clientWidth - 100)) + 'px';
            device.style.top = (Math.random() * (canvas.clientHeight - 100)) + 'px';

            device.innerHTML = `
                <div class="placed-device-icon">${icon}</div>
                <div class="placed-device-label">${label}</div>
            `;

            device.onmousedown = startDrag;
            device.onclick = (e) => {
                e.stopPropagation();
                selectDevice(device);
            };

            canvas.appendChild(device);

            devices.push({
                id: `device-${deviceCounter}`,
                type: type,
                element: device
            });

            deviceCounter++;
            updateStats();
        }

        let draggedElement = null;
        let offsetX, offsetY;

        function startDrag(e) {
            draggedElement = e.currentTarget;
            const rect = draggedElement.getBoundingClientRect();
            const canvas = document.getElementById('canvas');
            const canvasRect = canvas.getBoundingClientRect();

            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            document.onmousemove = drag;
            document.onmouseup = stopDrag;
        }

        function drag(e) {
            if (!draggedElement) return;

            const canvas = document.getElementById('canvas');
            const canvasRect = canvas.getBoundingClientRect();

            let newX = e.clientX - canvasRect.left - offsetX;
            let newY = e.clientY - canvasRect.top - offsetY;

            // Sınırları kontrol et
            newX = Math.max(0, Math.min(newX, canvas.clientWidth - draggedElement.offsetWidth));
            newY = Math.max(0, Math.min(newY, canvas.clientHeight - draggedElement.offsetHeight));

            draggedElement.style.left = newX + 'px';
            draggedElement.style.top = newY + 'px';

            updateConnections();
        }

        function stopDrag() {
            draggedElement = null;
            document.onmousemove = null;
            document.onmouseup = null;
        }

        function selectDevice(device) {
            if (selectedDevice === null) {
                selectedDevice = device;
                device.style.borderColor = '#f5576c';
            } else if (selectedDevice === device) {
                selectedDevice.style.borderColor = '#4facfe';
                selectedDevice = null;
            } else {
                // Bağlantı oluştur
                createConnection(selectedDevice, device);
                selectedDevice.style.borderColor = '#4facfe';
                selectedDevice = null;
            }
        }

        function createConnection(device1, device2) {
            // Aynı bağlantı var mı kontrol et
            const exists = connections.some(conn =>
                (conn.device1 === device1 && conn.device2 === device2) ||
                (conn.device1 === device2 && conn.device2 === device1)
            );

            if (!exists) {
                connections.push({ device1, device2 });
                drawConnections();
                updateStats();
            }
        }

        function drawConnections() {
            // Eski bağlantıları temizle
            document.querySelectorAll('.connection').forEach(el => el.remove());

            connections.forEach(conn => {
                const rect1 = conn.device1.getBoundingClientRect();
                const rect2 = conn.device2.getBoundingClientRect();
                const canvas = document.getElementById('canvas');
                const canvasRect = canvas.getBoundingClientRect();

                const x1 = rect1.left - canvasRect.left + rect1.width / 2;
                const y1 = rect1.top - canvasRect.top + rect1.height / 2;
                const x2 = rect2.left - canvasRect.left + rect2.width / 2;
                const y2 = rect2.top - canvasRect.top + rect2.height / 2;

                const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

                const line = document.createElement('div');
                line.className = 'connection';
                line.style.width = length + 'px';
                line.style.left = x1 + 'px';
                line.style.top = y1 + 'px';
                line.style.transform = `rotate(${angle}deg)`;

                canvas.appendChild(line);
            });
        }

        function updateConnections() {
            drawConnections();
        }

        function canvasClick(e) {
            if (e.target.id === 'canvas') {
                if (selectedDevice) {
                    selectedDevice.style.borderColor = '#4facfe';
                    selectedDevice = null;
                }
            }
        }

        function updateStats() {
            document.getElementById('deviceCount').textContent = `${devices.length}/7`;
            document.getElementById('connectionCount').textContent = `${connections.length}/6`;
        }

        function checkNetwork() {
            const routers = devices.filter(d => d.type === 'router');
            const computers = devices.filter(d => d.type === 'computer');
            const printers = devices.filter(d => d.type === 'printer');

            if (routers.length === 0) {
                alert('❌ Router eklemediniz! Ağ için router gereklidir.');
                return;
            }

            if (routers.length > 1) {
                alert('⚠️ Birden fazla router var. Tek router kullanmalısınız.');
                return;
            }

            const router = routers[0].element;
            let correctConnections = 0;

            // Router bağlantılarını kontrol et
            connections.forEach(conn => {
                if (conn.device1 === router || conn.device2 === router) {
                    correctConnections++;
                }
            });

            if (computers.length >= 4 && printers.length >= 2 && correctConnections >= 6) {
                alert('🎉 Tebrikler! Ağı başarıyla kurdunuz!\n\n✅ Router: 1\n✅ Bilgisayar: ' + computers.length + '\n✅ Yazıcı: ' + printers.length + '\n✅ Bağlantılar: ' + correctConnections);
            } else {
                alert('❌ Ağ tamamlanmadı!\n\n📌 Hedef:\n- 1 Router\n- 4 Bilgisayar\n- 2 Yazıcı\n- Tümü router\'a bağlı olmalı\n\n📊 Durumunuz:\n- Router: ' + routers.length + '\n- Bilgisayar: ' + computers.length + '\n- Yazıcı: ' + printers.length + '\n- Router bağlantıları: ' + correctConnections);
            }
        }

        function clearCanvas() {
            if (confirm('Tüm cihazları ve bağlantıları silmek istediğinizden emin misiniz?')) {
                devices = [];
                connections = [];
                deviceCounter = 0;
                selectedDevice = null;
                document.getElementById('canvas').innerHTML = '';
                updateStats();
            }
        }

        function autoComplete() {
            alert('💡 İpucu:\n\n1. Önce bir Router yerleştirin (merkeze)\n2. Ardından 4 Bilgisayar ekleyin\n3. 2 Yazıcı ekleyin\n4. Her cihaza tıklayın ve router\'a bağlayın\n\n🖱️ Bağlantı oluşturmak için:\n- İlk cihaza tıkla\n- Router\'a tıkla\n- Bağlantı otomatik oluşur!');
        }
    </script>
</body>
</html>
