<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker vs. Savunucu - BST</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #4facfe;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; }

        .role-selection {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin: 40px 0;
        }

        .role-card {
            padding: 40px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            border: 4px solid transparent;
        }

        .role-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .role-card.hacker {
            background: linear-gradient(135deg, #f5576c 0%, #d63447 100%);
            color: white;
        }

        .role-card.hacker:hover {
            border-color: #f5576c;
        }

        .role-card.defender {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .role-card.defender:hover {
            border-color: #4facfe;
        }

        .role-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .role-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .role-description {
            font-size: 1.1em;
            line-height: 1.6;
        }

        .game-board {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .player-panel {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
        }

        .player-panel.hacker {
            border: 4px solid #f5576c;
        }

        .player-panel.defender {
            border: 4px solid #4facfe;
        }

        .player-header {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
        }

        .player-panel.hacker .player-header {
            background: linear-gradient(135deg, #f5576c 0%, #d63447 100%);
            color: white;
        }

        .player-panel.defender .player-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .stat {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-weight: bold;
            color: #333;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .health-bar {
            background: #e0e0e0;
            height: 25px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            transition: width 0.5s;
            text-align: center;
            color: white;
            font-weight: bold;
            line-height: 25px;
        }

        .battlefield {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            border-radius: 15px;
            padding: 30px;
            min-height: 500px;
            color: white;
            position: relative;
        }

        .turn-indicator {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .action-btn {
            padding: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn.attack {
            background: linear-gradient(135deg, #f5576c 0%, #d63447 100%);
        }

        .action-btn.defend {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .action-cost {
            position: absolute;
            top: 5px;
            right: 10px;
            background: rgba(0,0,0,0.3);
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8em;
        }

        .log-container {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            background: rgba(255,255,255,0.05);
            border-left: 4px solid transparent;
        }

        .log-entry.attack {
            border-left-color: #f5576c;
        }

        .log-entry.defend {
            border-left-color: #4facfe;
        }

        .log-entry.info {
            border-left-color: #ffc107;
        }

        .network-visualization {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .network-node {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
        }

        .network-node.compromised {
            border-color: #f5576c;
            background: rgba(245, 87, 108, 0.2);
            animation: shake 0.5s;
        }

        .network-node.protected {
            border-color: #43e97b;
            background: rgba(67, 233, 123, 0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .game-over {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            color: #333;
        }

        .game-over-icon {
            font-size: 6em;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Hacker vs. Savunucu</h1>
        <p class="subtitle">Siber Güvenlik Savaşı - Stratejik Tur Tabanlı Oyun</p>

        <div id="gameArea"></div>

        <div class="buttons">
            <button class="btn btn-secondary" onclick="window.location.href='../index.html'">🏠 Ana Sayfa</button>
        </div>
    </div>

    <script>
        let gameState = {
            playerRole: null,
            playerHealth: 100,
            enemyHealth: 100,
            playerEnergy: 100,
            enemyEnergy: 100,
            turn: 0,
            playerIsActive: true,
            logs: [],
            networkNodes: [
                { id: 1, name: 'Web Sunucusu', compromised: false, protected: false },
                { id: 2, name: 'Veritabanı', compromised: false, protected: false },
                { id: 3, name: 'Mail Sunucusu', compromised: false, protected: false },
                { id: 4, name: 'FTP Sunucusu', compromised: false, protected: false },
                { id: 5, name: 'DNS Sunucusu', compromised: false, protected: false },
                { id: 6, name: 'Yönetici Paneli', compromised: false, protected: false }
            ]
        };

        const hackerActions = [
            { id: 'port-scan', name: '🔍 Port Tarama', damage: 10, cost: 20, description: 'Açık portları tara ve zafiyet bul' },
            { id: 'ddos', name: '💥 DDoS Saldırısı', damage: 25, cost: 40, description: 'Ağı trafikle yavaşlat' },
            { id: 'phishing', name: '🎣 Phishing', damage: 20, cost: 30, description: 'Sahte e-posta gönder' },
            { id: 'malware', name: '🦠 Malware', damage: 35, cost: 50, description: 'Zararlı yazılım yerleştir' }
        ];

        const defenderActions = [
            { id: 'firewall', name: '🛡️ Güvenlik Duvarı', heal: 15, cost: 25, description: 'Trafiği filtrele ve engelle' },
            { id: 'antivirus', name: '🔒 Antivirüs Tarama', heal: 20, cost: 35, description: 'Zararlı yazılımları temizle' },
            { id: 'patch', name: '🔧 Güvenlik Yaması', heal: 25, cost: 40, description: 'Zafiyetleri kapat' },
            { id: 'backup', name: '💾 Yedekleme', heal: 30, cost: 45, description: 'Sistemi geri yükle' }
        ];

        function showRoleSelection() {
            const html = `
                <div class="role-selection">
                    <div class="role-card hacker" onclick="selectRole('hacker')">
                        <div class="role-icon">🎭</div>
                        <div class="role-title">HACKER</div>
                        <div class="role-description">
                            Sistem zafiyetlerini bul ve saldırılar düzenle.
                            Amacın: Savunucunun sistemini çökert!
                            <br><br>
                            <strong>Yetenekler:</strong> Port Tarama, DDoS, Phishing, Malware
                        </div>
                    </div>
                    <div class="role-card defender" onclick="selectRole('defender')">
                        <div class="role-icon">🛡️</div>
                        <div class="role-title">SAVUNUCU</div>
                        <div class="role-description">
                            Sistemi saldırılara karşı koru ve güvenliği sağla.
                            Amacın: Hacker'ı durdur!
                            <br><br>
                            <strong>Yetenekler:</strong> Firewall, Antivirüs, Yama, Yedekleme
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('gameArea').innerHTML = html;
        }

        function selectRole(role) {
            gameState.playerRole = role;
            gameState.playerIsActive = (role === 'hacker');
            addLog(`${role === 'hacker' ? '🎭 Hacker' : '🛡️ Savunucu'} rolünü seçtin! Oyun başlıyor...`, 'info');
            startGame();
        }

        function startGame() {
            renderGame();
            if (!gameState.playerIsActive) {
                setTimeout(enemyTurn, 1500);
            }
        }

        function renderGame() {
            const isHacker = gameState.playerRole === 'hacker';
            const actions = isHacker ? hackerActions : defenderActions;
            const playerName = isHacker ? '🎭 HACKER (Sen)' : '🛡️ SAVUNUCU (Sen)';
            const enemyName = isHacker ? '🛡️ SAVUNUCU (AI)' : '🎭 HACKER (AI)';

            const html = `
                <div class="game-board">
                    <div class="player-panel ${isHacker ? 'hacker' : 'defender'}">
                        <div class="player-header">${playerName}</div>
                        <div class="stat">
                            <span class="stat-label">❤️ Sağlık</span>
                            <span class="stat-value" style="color: ${isHacker ? '#f5576c' : '#4facfe'}">${gameState.playerHealth}</span>
                        </div>
                        <div class="health-bar">
                            <div class="health-fill" style="width: ${gameState.playerHealth}%">${gameState.playerHealth}%</div>
                        </div>
                        <div class="stat">
                            <span class="stat-label">⚡ Enerji</span>
                            <span class="stat-value" style="color: ${isHacker ? '#f5576c' : '#4facfe'}">${gameState.playerEnergy}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">🎯 Tur</span>
                            <span class="stat-value" style="color: ${isHacker ? '#f5576c' : '#4facfe'}">${gameState.turn}</span>
                        </div>
                    </div>

                    <div class="battlefield">
                        <div class="turn-indicator">
                            ${gameState.playerIsActive ? '🟢 SENİN TURUN' : '🔴 RAKIP DÜŞÜNÜYOR...'}
                        </div>

                        <div class="network-visualization">
                            ${gameState.networkNodes.map(node => `
                                <div class="network-node ${node.compromised ? 'compromised' : ''} ${node.protected ? 'protected' : ''}">
                                    <div style="font-size: 2em; margin-bottom: 10px;">
                                        ${node.compromised ? '🔴' : node.protected ? '🟢' : '⚪'}
                                    </div>
                                    <div style="font-size: 0.9em;">${node.name}</div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="action-buttons">
                            ${actions.map(action => `
                                <button class="action-btn ${isHacker ? 'attack' : 'defend'}"
                                        onclick="performAction('${action.id}')"
                                        ${!gameState.playerIsActive || gameState.playerEnergy < action.cost ? 'disabled' : ''}>
                                    <span class="action-cost">⚡${action.cost}</span>
                                    ${action.name}
                                    <div style="font-size: 0.8em; margin-top: 5px; opacity: 0.9;">
                                        ${isHacker ? `💥 ${action.damage} hasar` : `💚 +${action.heal} sağlık`}
                                    </div>
                                </button>
                            `).join('')}
                        </div>

                        <div class="log-container">
                            <strong>📜 Oyun Günlüğü:</strong>
                            ${gameState.logs.map(log => `<div class="log-entry ${log.type}">${log.message}</div>`).reverse().join('')}
                        </div>
                    </div>

                    <div class="player-panel ${isHacker ? 'defender' : 'hacker'}">
                        <div class="player-header">${enemyName}</div>
                        <div class="stat">
                            <span class="stat-label">❤️ Sağlık</span>
                            <span class="stat-value" style="color: ${isHacker ? '#4facfe' : '#f5576c'}">${gameState.enemyHealth}</span>
                        </div>
                        <div class="health-bar">
                            <div class="health-fill" style="width: ${gameState.enemyHealth}%">${gameState.enemyHealth}%</div>
                        </div>
                        <div class="stat">
                            <span class="stat-label">⚡ Enerji</span>
                            <span class="stat-value" style="color: ${isHacker ? '#4facfe' : '#f5576c'}">${gameState.enemyEnergy}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">📊 Durum</span>
                            <span class="stat-value" style="font-size: 1em;">
                                ${gameState.enemyHealth > 70 ? '🟢 İyi' : gameState.enemyHealth > 40 ? '🟡 Orta' : '🔴 Kötü'}
                            </span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('gameArea').innerHTML = html;
        }

        function performAction(actionId) {
            if (!gameState.playerIsActive) return;

            const isHacker = gameState.playerRole === 'hacker';
            const actions = isHacker ? hackerActions : defenderActions;
            const action = actions.find(a => a.id === actionId);

            if (gameState.playerEnergy < action.cost) {
                alert('⚠️ Yeterli enerjin yok!');
                return;
            }

            gameState.playerEnergy -= action.cost;
            gameState.playerIsActive = false;

            if (isHacker) {
                gameState.enemyHealth -= action.damage;
                const node = gameState.networkNodes[Math.floor(Math.random() * gameState.networkNodes.length)];
                node.compromised = true;
                addLog(`🎭 ${action.name} kullandın! Rakibe ${action.damage} hasar verdin.`, 'attack');
            } else {
                gameState.playerHealth = Math.min(100, gameState.playerHealth + action.heal);
                const node = gameState.networkNodes.find(n => !n.protected);
                if (node) node.protected = true;
                addLog(`🛡️ ${action.name} kullandın! ${action.heal} sağlık kazandın.`, 'defend');
            }

            checkGameOver();
            renderGame();

            if (!checkGameOver()) {
                setTimeout(enemyTurn, 2000);
            }
        }

        function enemyTurn() {
            const isPlayerHacker = gameState.playerRole === 'hacker';
            const actions = isPlayerHacker ? defenderActions : hackerActions;
            const affordableActions = actions.filter(a => a.cost <= gameState.enemyEnergy);

            if (affordableActions.length === 0) {
                gameState.enemyEnergy = Math.min(100, gameState.enemyEnergy + 30);
                addLog('🤖 Rakip enerji topluyor...', 'info');
            } else {
                const action = affordableActions[Math.floor(Math.random() * affordableActions.length)];
                gameState.enemyEnergy -= action.cost;

                if (isPlayerHacker) {
                    // AI is defender
                    gameState.enemyHealth = Math.min(100, gameState.enemyHealth + action.heal);
                    const node = gameState.networkNodes.find(n => n.compromised && !n.protected);
                    if (node) {
                        node.compromised = false;
                        node.protected = true;
                    }
                    addLog(`🤖 Rakip ${action.name} kullandı! ${action.heal} sağlık kazandı.`, 'defend');
                } else {
                    // AI is hacker
                    gameState.playerHealth -= action.damage;
                    const node = gameState.networkNodes.find(n => !n.compromised);
                    if (node) node.compromised = true;
                    addLog(`🤖 Rakip ${action.name} kullandı! Sana ${action.damage} hasar verdi!`, 'attack');
                }
            }

            gameState.turn++;
            gameState.playerEnergy = Math.min(100, gameState.playerEnergy + 25);
            gameState.enemyEnergy = Math.min(100, gameState.enemyEnergy + 25);
            gameState.playerIsActive = true;

            checkGameOver();
            renderGame();
        }

        function checkGameOver() {
            if (gameState.playerHealth <= 0 || gameState.enemyHealth <= 0) {
                showGameOver();
                return true;
            }
            return false;
        }

        function showGameOver() {
            const playerWon = gameState.enemyHealth <= 0;
            const isHacker = gameState.playerRole === 'hacker';

            const html = `
                <div class="game-over">
                    <div class="game-over-icon">${playerWon ? '🏆' : '💔'}</div>
                    <h2 style="font-size: 2.5em; color: ${playerWon ? '#28a745' : '#dc3545'}; margin-bottom: 20px;">
                        ${playerWon ? 'KAZANDIN!' : 'KAYBETTİN!'}
                    </h2>
                    <p style="font-size: 1.3em; margin: 20px 0;">
                        ${playerWon
                            ? isHacker
                                ? 'Sistemi başarıyla ele geçirdin! Mükemmel hacker taktikleri!'
                                : 'Sistemi başarıyla korudun! Harika savunma!'
                            : isHacker
                                ? 'Savunucu seni durdurdu! Stratejini geliştir.'
                                : 'Hacker sistemi ele geçirdi! Daha güçlü savunma gerek!'
                        }
                    </p>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 30px 0; text-align: left;">
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
                            <h3 style="color: ${isHacker ? '#f5576c' : '#4facfe'}; margin-bottom: 15px;">📊 İstatistikler</h3>
                            <p>⏱️ Tur Sayısı: ${gameState.turn}</p>
                            <p>❤️ Kalan Sağlık: ${gameState.playerHealth}</p>
                            <p>⚡ Kalan Enerji: ${gameState.playerEnergy}</p>
                            <p>🎯 Ele Geçirilen: ${gameState.networkNodes.filter(n => isHacker ? n.compromised : n.protected).length}/6</p>
                        </div>
                        <div style="background: #e7f3ff; padding: 20px; border-radius: 10px;">
                            <h3 style="color: #4facfe; margin-bottom: 15px;">🎓 Öğrendikleriniz</h3>
                            <ul style="line-height: 2; list-style-position: inside;">
                                <li>Siber saldırı türleri</li>
                                <li>Savunma mekanizmaları</li>
                                <li>Enerji yönetimi</li>
                                <li>Strateji geliştirme</li>
                            </ul>
                        </div>
                    </div>
                    <div class="buttons">
                        <button class="btn btn-primary" onclick="location.reload()">🔄 Tekrar Oyna</button>
                        <button class="btn btn-primary" onclick="showRoleSelection()">🎭 Rol Değiştir</button>
                    </div>
                </div>
            `;

            document.getElementById('gameArea').innerHTML = html;
        }

        function addLog(message, type) {
            gameState.logs.push({ message, type, timestamp: Date.now() });
            if (gameState.logs.length > 20) {
                gameState.logs.shift();
            }
        }

        // Oyunu başlat
        showRoleSelection();
    </script>
</body>
</html>
