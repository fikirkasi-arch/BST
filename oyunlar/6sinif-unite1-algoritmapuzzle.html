<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Algoritma Bulmaca - Mantık Oyunu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #d57eeb;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .puzzle-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .puzzle-block {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 15px;
            border: 3px dashed #ddd;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
        }
        .puzzle-block.filled {
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
            color: white;
            border-style: solid;
            border-color: #d57eeb;
        }
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .option {
            padding: 15px;
            background: white;
            border: 2px solid #d57eeb;
            border-radius: 10px;
            cursor: move;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s;
        }
        .option:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .option.dragging {
            opacity: 0.5;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .result {
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Algoritma Bulmaca</h1>
        <p class="subtitle">Doğru sırayla yaparak algoritmayı tamamlayın!</p>

        <div style="background: #e7f3ff; padding: 20px; border-radius: 10px; margin: 20px 0;">
            <h3 style="color: #0056b3; margin-bottom: 10px;">🎯 Görev: Kahvaltı Hazırlama Algoritması</h3>
            <p>Aşağıdaki adımları sürükleyerek kahvaltı hazırlama algoritmasını doğru sıraya koyun!</p>
        </div>

        <div class="puzzle-container" id="puzzleContainer">
            <div class="puzzle-block" data-position="0">Adım 1</div>
            <div class="puzzle-block" data-position="1">Adım 2</div>
            <div class="puzzle-block" data-position="2">Adım 3</div>
            <div class="puzzle-block" data-position="3">Adım 4</div>
            <div class="puzzle-block" data-position="4">Adım 5</div>
            <div class="puzzle-block" data-position="5">Adım 6</div>
        </div>

        <div class="result" id="result"></div>

        <h3 style="margin: 30px 0 15px 0; text-align: center; color: #666;">Seçenekler (Sürükle & Bırak)</h3>
        <div class="options" id="options"></div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="checkSolution()">✓ Kontrol Et</button>
            <button class="btn btn-primary" onclick="resetPuzzle()">🔄 Sıfırla</button>
            <button class="btn btn-secondary" onclick="window.location.href='../index.html'">🏠 Ana Sayfa</button>
        </div>
    </div>

    <script>
        const correctOrder = [
            'Mutfağa git',
            'Buzdolabını aç',
            'Yumurta ve süt al',
            'Tavayı ocağa koy',
            'Yumurtayı pişir',
            'Sofraya getir'
        ];

        let currentOrder = Array(6).fill(null);
        let options = [...correctOrder].sort(() => Math.random() - 0.5);

        function init() {
            renderOptions();
            setupDragAndDrop();
        }

        function renderOptions() {
            const container = document.getElementById('options');
            container.innerHTML = '';

            options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = option;
                div.draggable = true;
                div.dataset.index = index;
                div.dataset.value = option;
                container.appendChild(div);
            });
        }

        function setupDragAndDrop() {
            let draggedElement = null;

            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('dragstart', (e) => {
                    draggedElement = e.target;
                    e.target.classList.add('dragging');
                });

                option.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                });
            });

            document.querySelectorAll('.puzzle-block').forEach(block => {
                block.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    block.style.background = '#fef3e2';
                });

                block.addEventListener('dragleave', () => {
                    if (!block.classList.contains('filled')) {
                        block.style.background = '#f5f5f5';
                    }
                });

                block.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedElement) {
                        const position = parseInt(block.dataset.position);
                        const value = draggedElement.dataset.value;

                        currentOrder[position] = value;
                        block.textContent = value;
                        block.classList.add('filled');
                        block.style.background = '';

                        draggedElement.remove();
                        options = options.filter(o => o !== value);
                    }
                });
            });
        }

        function checkSolution() {
            const resultEl = document.getElementById('result');

            if (currentOrder.some(o => o === null)) {
                resultEl.className = 'result error';
                resultEl.textContent = '❌ Lütfen tüm adımları doldurun!';
                resultEl.style.display = 'block';
                return;
            }

            const isCorrect = currentOrder.every((val, idx) => val === correctOrder[idx]);

            if (isCorrect) {
                resultEl.className = 'result success';
                resultEl.textContent = '🎉 Tebrikler! Algoritmayı doğru sıraladınız!';
            } else {
                resultEl.className = 'result error';
                resultEl.textContent = '❌ Yanlış sıralama. Tekrar deneyin!';
            }

            resultEl.style.display = 'block';
        }

        function resetPuzzle() {
            currentOrder = Array(6).fill(null);
            options = [...correctOrder].sort(() => Math.random() - 0.5);

            document.querySelectorAll('.puzzle-block').forEach(block => {
                block.textContent = `Adım ${parseInt(block.dataset.position) + 1}`;
                block.classList.remove('filled');
                block.style.background = '';
            });

            document.getElementById('result').style.display = 'none';
            init();
        }

        init();
    </script>
</body>
</html>
