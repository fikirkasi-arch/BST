<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haftalık İçerikler - BTY Dersi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .selector-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .selector-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .selector-group {
            display: flex;
            flex-direction: column;
        }

        .selector-group label {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        select {
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: #764ba2;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }

        .content-section {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .week-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .week-info h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .week-info p {
            font-size: 1.1em;
            opacity: 0.95;
            margin: 5px 0;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .content-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .content-card:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transform: translateY(-5px);
            border-color: #667eea;
        }

        .content-card h3 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content-card .icon {
            font-size: 1.8em;
        }

        .game-card {
            border-color: #4CAF50;
        }

        .game-card h3 {
            color: #4CAF50;
        }

        .homework-card {
            border-color: #FF9800;
        }

        .homework-card h3 {
            color: #FF9800;
        }

        .fun-card {
            border-color: #E91E63;
        }

        .fun-card h3 {
            color: #E91E63;
        }

        .task-list {
            list-style: none;
            padding: 0;
        }

        .task-list li {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            padding-left: 25px;
            position: relative;
        }

        .task-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4CAF50;
            font-weight: bold;
        }

        .task-list li:last-child {
            border-bottom: none;
        }

        .game-type-badge {
            display: inline-block;
            padding: 5px 15px;
            background: #4CAF50;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .riddle-box {
            background: linear-gradient(135deg, #FFE5EC 0%, #FFC3D5 100%);
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .riddle-box h4 {
            color: #E91E63;
            margin-bottom: 10px;
        }

        .riddle-answer {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            color: #E91E63;
        }

        .riddle-answer:hover {
            background: #f0f0f0;
        }

        .riddle-answer.hidden {
            background: #E91E63;
            color: white;
        }

        .joke-box {
            background: linear-gradient(135deg, #FFF8E1 0%, #FFE082 100%);
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            white-space: pre-line;
        }

        .joke-box h4 {
            color: #F57C00;
            margin-bottom: 10px;
        }

        .fact-box {
            background: linear-gradient(135deg, #E3F2FD 0%, #90CAF9 100%);
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .fact-box h4 {
            color: #1976D2;
            margin-bottom: 10px;
        }

        .no-selection {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-selection .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .no-selection h3 {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2em;
            }

            .week-info h2 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Haftalık İçerikler</h1>
            <p>Her hafta için özel hazırlanmış oyun, ödev ve meraklısına bölümü</p>
        </header>

        <div class="selector-container">
            <h2 style="color: #667eea; margin-bottom: 15px;">🎯 Hafta Seçin</h2>
            <div class="selector-grid">
                <div class="selector-group">
                    <label for="grade-select">Sınıf Seçin:</label>
                    <select id="grade-select" onchange="onGradeChange()">
                        <option value="">Sınıf Seçin</option>
                        <option value="5">5. Sınıf</option>
                        <option value="6">6. Sınıf</option>
                    </select>
                </div>
                <div class="selector-group">
                    <label for="week-select">Hafta Seçin:</label>
                    <select id="week-select" onchange="onWeekChange()" disabled>
                        <option value="">Önce sınıf seçin</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="content-container" class="content-section">
            <div class="no-selection">
                <div class="emoji">🎓</div>
                <h3>Hafta Seçin</h3>
                <p>Yukarıdan sınıf ve hafta seçerek içerikleri görüntüleyebilirsiniz.</p>
            </div>
        </div>
    </div>

    <script>
        let weeklyData = null;
        let currentGrade = null;

        // JSON verisini yükle
        fetch('weekly_content.json')
            .then(response => response.json())
            .then(data => {
                weeklyData = data;
                console.log('Haftalık içerikler yüklendi:', data);
            })
            .catch(error => {
                console.error('Veri yükleme hatası:', error);
                alert('İçerikler yüklenirken bir hata oluştu.');
            });

        function onGradeChange() {
            const gradeSelect = document.getElementById('grade-select');
            const weekSelect = document.getElementById('week-select');
            const grade = gradeSelect.value;

            if (!grade) {
                weekSelect.disabled = true;
                weekSelect.innerHTML = '<option value="">Önce sınıf seçin</option>';
                clearContent();
                return;
            }

            currentGrade = grade;
            const gradeKey = `grade${grade}`;
            const weeks = weeklyData[gradeKey];

            // Hafta dropdown'ını doldur
            weekSelect.innerHTML = '<option value="">Hafta Seçin</option>';
            weeks.forEach((week, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${week.week}. Hafta - ${week.topic || 'Konu Yok'}`;
                weekSelect.appendChild(option);
            });

            weekSelect.disabled = false;
            clearContent();
        }

        function onWeekChange() {
            const weekSelect = document.getElementById('week-select');
            const weekIndex = weekSelect.value;

            if (weekIndex === '') {
                clearContent();
                return;
            }

            const gradeKey = `grade${currentGrade}`;
            const weekData = weeklyData[gradeKey][parseInt(weekIndex)];

            displayContent(weekData);
        }

        function displayContent(data) {
            const container = document.getElementById('content-container');
            container.classList.add('active');

            container.innerHTML = `
                <div class="week-info">
                    <h2>📚 ${data.grade}. Sınıf - ${data.week}. Hafta</h2>
                    <p><strong>📌 Ünite:</strong> ${data.unit || 'Belirtilmemiş'}</p>
                    <p><strong>📖 Konu:</strong> ${data.topic || 'Belirtilmemiş'}</p>
                    <p><strong>🎯 Kazanım:</strong> ${data.outcome || 'Belirtilmemiş'}</p>
                </div>

                <div class="content-grid">
                    <!-- OYUN -->
                    <div class="content-card game-card">
                        <h3><span class="icon">🎮</span> Haftanın Oyunu</h3>
                        <h4 style="color: #333; margin: 15px 0;">${data.game.title}</h4>
                        <p style="color: #666; line-height: 1.6;">${data.game.description}</p>
                        <span class="game-type-badge">${getGameTypeName(data.game.type)}</span>
                    </div>

                    <!-- ÖDEV -->
                    <div class="content-card homework-card">
                        <h3><span class="icon">📝</span> Haftanın Ödevi</h3>
                        <h4 style="color: #333; margin: 15px 0;">${data.homework.title}</h4>
                        <p style="color: #666; margin-bottom: 15px;"><strong>Süre:</strong> ${data.homework.duration}</p>
                        <ul class="task-list">
                            ${data.homework.tasks.map(task => `<li>${task}</li>`).join('')}
                        </ul>
                    </div>

                    <!-- MERAKLISINA -->
                    <div class="content-card fun-card">
                        <h3><span class="icon">🎉</span> Meraklısına</h3>

                        <div class="fact-box">
                            <h4>💡 İlginç Bilgi</h4>
                            <p style="line-height: 1.6;">${data.fun.fun_fact}</p>
                        </div>

                        <div class="riddle-box">
                            <h4>🤔 Bulmaca</h4>
                            <p style="margin-bottom: 10px;"><strong>Soru:</strong> ${data.fun.riddle.soru}</p>
                            <div class="riddle-answer hidden" onclick="this.classList.toggle('hidden')">
                                Cevabı Görmek İçin Tıkla
                            </div>
                            <div class="riddle-answer" style="display: none;">${data.fun.riddle.cevap}</div>
                        </div>

                        <div class="joke-box">
                            <h4>😄 Fıkra</h4>
                            <p style="line-height: 1.8;">${data.fun.joke}</p>
                        </div>
                    </div>
                </div>
            `;

            // Bulmaca toggle işlevi
            const riddleAnswers = container.querySelectorAll('.riddle-answer');
            riddleAnswers[0].addEventListener('click', function() {
                riddleAnswers[0].style.display = 'none';
                riddleAnswers[1].style.display = 'block';
            });
        }

        function getGameTypeName(type) {
            const types = {
                'quiz': 'Quiz Oyunu',
                'matching': 'Eşleştirme Oyunu',
                'memory': 'Hafıza Oyunu',
                'sorting': 'Sıralama Oyunu'
            };
            return types[type] || 'Eğitsel Oyun';
        }

        function clearContent() {
            const container = document.getElementById('content-container');
            container.classList.remove('active');
            container.innerHTML = `
                <div class="no-selection">
                    <div class="emoji">🎓</div>
                    <h3>Hafta Seçin</h3>
                    <p>Yukarıdan sınıf ve hafta seçerek içerikleri görüntüleyebilirsiniz.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
