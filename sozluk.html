        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1em;
            opacity: 0.95;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .glossary-content {
            padding: 30px;
        }

        .glossary-item {
            margin-bottom: 15px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .glossary-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .glossary-header {
            padding: 20px;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .glossary-header:hover {
            background: #f0f0f0;
        }

        .glossary-header.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .term-main {
            flex: 1;
        }

        .term-name {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .term-en {
            font-size: 0.95em;
            opacity: 0.8;
            font-style: italic;
        }

        .term-unit {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 15px;
        }

        .glossary-header.active .term-unit {
            background: rgba(255,255,255,0.3);
        }

        .toggle-icon {
            font-size: 1.5em;
            transition: transform 0.3s;
        }

        .glossary-item.expanded .toggle-icon {
            transform: rotate(180deg);
        }

        .glossary-body {
            display: none;
            padding: 20px;
            border-top: 2px solid #f0f0f0;
            background: white;
        }

        .glossary-item.expanded .glossary-body {
            display: block;
        }

        .glossary-body p {
            margin-bottom: 15px;
            line-height: 1.6;
            color: #333;
        }

        .definition-label {
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .related-topics {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .related-topics strong {
            color: #667eea;
            display: block;
            margin-bottom: 8px;
        }

        .topic-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .topic-tag {
            background: #e9ecef;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            color: #555;
        }

        .links-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .link-btn {
            padding: 10px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95em;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .no-results h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .stats {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.95em;
            border-top: 2px solid #f0f0f0;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }

            .filters {
                justify-content: center;
            }

            .glossary-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .term-unit {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const glossaryContent = document.getElementById('glossaryContent');
        const resultCount = document.getElementById('resultCount');

        let activeFilter = 'all';

        // Initialize
        function init() {
            renderGlossary(glossaryData);
            addEventListeners();
        }

        // Render glossary
        function renderGlossary(data) {
            glossaryContent.innerHTML = '';

            if (data.length === 0) {
                glossaryContent.innerHTML = `
                    <div class="no-results">
                        <h3>😢 Sonuç bulunamadı</h3>
                        <p>Arama kriterlerinize uygun terim yok. Başka bir arama deneyin.</p>
                    </div>
                `;
                resultCount.textContent = '0 terim gösteriliyor';
                return;
            }

            data.forEach((term, index) => {
                const item = document.createElement('div');
                item.className = 'glossary-item';
                item.dataset.index = index;

                const relatedHTML = term.related.length > 0
                    ? `<div class="related-topics">
                        <strong>İlgili Konular:</strong>
                        <div class="topic-list">
                            ${term.related.map(t => `<span class="topic-tag">${t}</span>`).join('')}
                        </div>
                       </div>`
                    : '';

                const linksHTML = term.videoLink || term.infoLink
                    ? `<div class="links-section">
                        ${term.videoLink ? `<a href="${term.videoLink}" target="_blank" class="link-btn">🎥 Videoyu İzle</a>` : ''}
                        ${term.infoLink ? `<a href="${term.infoLink}" target="_blank" class="link-btn">📖 Daha Fazla Bilgi</a>` : ''}
                       </div>`
                    : '';

                item.innerHTML = `
                    <div class="glossary-header">
                        <div class="term-main">
                            <div class="term-name">${term.tr}</div>
                            <div class="term-en">${term.en}</div>
                        </div>
                        <span class="term-unit">${term.unit}</span>
                        <span class="toggle-icon">▼</span>
                    </div>
                    <div class="glossary-body">
                        <p>
                            <div class="definition-label">📝 Tanım:</div>
                            ${term.definition}
                        </p>
                        ${relatedHTML}
                        ${linksHTML}
                    </div>
                `;

                item.querySelector('.glossary-header').addEventListener('click', () => toggleItem(item));
                glossaryContent.appendChild(item);
            });

            resultCount.textContent = `${data.length} terim gösteriliyor`;
        }

        // Toggle item
        function toggleItem(item) {
            item.classList.toggle('expanded');
            const header = item.querySelector('.glossary-header');
            header.classList.toggle('active');
        }

        // Filter and search
        function filterAndSearch() {
            let filtered = glossaryData;

            // Apply grade/unit filter
            if (activeFilter !== 'all') {
                filtered = filtered.filter(term =>
                    term.grade === activeFilter || term.unit === activeFilter
                );
            }

            // Apply search filter
            const searchTerm = searchInput.value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(term =>
                    term.tr.toLowerCase().includes(searchTerm) ||
                    term.en.toLowerCase().includes(searchTerm) ||
                    term.definition.toLowerCase().includes(searchTerm)
                );
            }

            renderGlossary(filtered);
        }

        // Event listeners
        function addEventListeners() {
            // Search
            searchInput.addEventListener('input', filterAndSearch);

            // Filters
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeFilter = btn.dataset.filter;
                    filterAndSearch();
                });
            });
        }

        // Start
        init();
    </script>
