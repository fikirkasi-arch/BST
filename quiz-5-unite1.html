<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5. Sınıf Ünite 1 Quiz - Bilişim Temelleri</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .quiz-container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #667eea; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.2em; }
        .progress-bar { width: 100%; height: 30px; background: #e0e0e0; border-radius: 15px; overflow: hidden; margin-bottom: 30px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); width: 0%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .question-number { color: #667eea; font-weight: bold; font-size: 1.2em; margin-bottom: 10px; }
        .question-text { font-size: 1.3em; color: #333; margin-bottom: 20px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 15px; }
        .option { padding: 20px; border: 3px solid #e0e0e0; border-radius: 15px; cursor: pointer; transition: all 0.3s; font-size: 1.1em; }
        .option:hover { border-color: #667eea; background: #f5f5ff; transform: translateX(10px); }
        .option.selected { border-color: #667eea; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .buttons { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .btn { padding: 15px 40px; font-size: 1.1em; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-container { text-align: center; display: none; }
        .score-display { font-size: 5em; color: #667eea; font-weight: bold; margin: 30px 0; }
        .emoji-celebration { font-size: 4em; margin: 20px 0; }
        .score-details { background: #f5f5ff; padding: 30px; border-radius: 15px; margin-bottom: 30px; }
        .score-item { font-size: 1.2em; margin: 10px 0; color: #555; }
        .wrong-answers { background: #fff5f5; padding: 25px; border-radius: 15px; margin: 20px 0; text-align: left; }
        .wrong-answers h3 { color: #f44336; margin-bottom: 15px; }
        .wrong-answer-item { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 4px solid #f44336; }
        .wrong-answer-item strong { color: #f44336; }
        .correct-answer { color: #4caf50; font-weight: bold; margin-top: 5px; }
        .topics-to-study { background: #fff9e6; padding: 25px; border-radius: 15px; margin: 20px 0; text-align: left; }
        .topics-to-study h3 { color: #ff9800; margin-bottom: 15px; }
        .topic-item { background: white; padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 4px solid #ff9800; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>📚 Bilişim Temelleri Quiz</h1>
        <p class="subtitle">5. Sınıf - Ünite 1 | 10 Soru</p>
        <div class="progress-bar"><div class="progress-fill" id="progressBar">0/10</div></div>
        <div id="quizContent">
            <div><div class="question-number" id="questionNumber"></div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div></div>
            <div class="buttons">
                <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()" disabled>⬅️ Önceki</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Sonraki ➡️</button>
                <button class="btn btn-primary" id="finishBtn" onclick="finishQuiz()" style="display:none;">✅ Bitir</button>
            </div>
        </div>
        <div class="result-container" id="resultContainer">
            <div class="emoji-celebration" id="celebrationEmoji"></div>
            <div class="score-display" id="scoreDisplay"></div>
            <div class="score-details">
                <div class="score-item">✅ Doğru: <strong id="correctCount">0</strong></div>
                <div class="score-item">❌ Yanlış: <strong id="incorrectCount">0</strong></div>
                <div class="score-item">📊 Başarı: <strong id="successRate">0%</strong></div>
            </div>
            <div id="wrongAnswersSection"></div>
            <div id="topicsSection"></div>
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 Tekrar Dene</button>
            <br><a href="sozluk.html" style="display:inline-block; margin-top:20px; color:#667eea; text-decoration:none; font-size:1.1em;">📖 Sözlüğe Dön</a>
        </div>
    </div>
    <script>
        const questions = [
            { question: "Bilgisayarın beyni olarak adlandırılan parça hangisidir?", options: ["RAM", "İşlemci (CPU)", "Harddisk", "Ekran Kartı"], correct: 1, topic: "Donanım" },
            { question: "Aşağıdakilerden hangisi bir işletim sistemi DEĞİLDİR?", options: ["Windows", "Linux", "Microsoft Word", "macOS"], correct: 2, topic: "İşletim Sistemi" },
            { question: "Bilgisayarda geçici olarak veri saklayan bellek hangisidir?", options: ["CPU", "RAM", "SSD", "Monitor"], correct: 1, topic: "Bellek (RAM)" },
            { question: "Dosya isimlendirmede KULLANILMAMASI gereken karakter hangisidir?", options: ["- (tire)", "_ (alt tire)", "? (soru işareti)", "Rakamlar"], correct: 2, topic: "Dosya Yönetimi" },
            { question: "1 Byte kaç bit'tir?", options: ["4 bit", "8 bit", "16 bit", "32 bit"], correct: 1, topic: "Veri Birimleri" },
            { question: "Hangi depolama birimi en büyüktür?", options: ["1 KB", "1 GB", "1 MB", "1 Byte"], correct: 1, topic: "Depolama Birimleri" },
            { question: "HDD'ye göre SSD'nin avantajı nedir?", options: ["Daha ucuz", "Daha hızlı", "Daha fazla depolama", "Daha eski teknoloji"], correct: 1, topic: "Depolama Cihazları" },
            { question: "Hangi cihaz girdi cihazı değildir?", options: ["Klavye", "Mouse", "Monitör", "Mikrofon"], correct: 2, topic: "Girdi/Çıktı Cihazları" },
            { question: "USB'nin açılımı nedir?", options: ["United System Bus", "Universal Serial Bus", "Unique Storage Box", "Ultra Speed Band"], correct: 1, topic: "Bağlantı Standartları" },
            { question: "Dosyaları organize etmek için kullanılan dijital kapsayıcıya ne denir?", options: ["Klasör", "Windows", "Dosya", "Program"], correct: 0, topic: "Dosya Yönetimi" }
        ];
        let currentQuestion = 0, userAnswers = [], selectedOption = null;
        function loadQuestion() { const q = questions[currentQuestion]; document.getElementById('questionNumber').textContent = `Soru ${currentQuestion + 1}/${questions.length}`; document.getElementById('questionText').textContent = q.question; const container = document.getElementById('optionsContainer'); container.innerHTML = ''; q.options.forEach((opt, idx) => { const div = document.createElement('div'); div.className = 'option'; div.textContent = opt; div.onclick = () => selectOption(idx); if (userAnswers[currentQuestion] === idx) { div.classList.add('selected'); selectedOption = idx; } container.appendChild(div); }); updateProgress(); updateButtons(); }
        function selectOption(idx) { selectedOption = idx; userAnswers[currentQuestion] = idx; document.querySelectorAll('.option').forEach((o, i) => { o.classList.remove('selected'); if (i === idx) o.classList.add('selected'); }); updateButtons(); }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; selectedOption = null; loadQuestion(); } }
        function previousQuestion() { if (currentQuestion > 0) { currentQuestion--; selectedOption = userAnswers[currentQuestion]; loadQuestion(); } }
        function updateButtons() { document.getElementById('prevBtn').disabled = currentQuestion === 0; document.getElementById('nextBtn').disabled = selectedOption === null; if (currentQuestion === questions.length - 1) { document.getElementById('nextBtn').style.display = 'none'; document.getElementById('finishBtn').style.display = 'inline-block'; document.getElementById('finishBtn').disabled = userAnswers.filter(a => a !== undefined).length !== questions.length; } else { document.getElementById('nextBtn').style.display = 'inline-block'; document.getElementById('finishBtn').style.display = 'none'; } }
        function updateProgress() { const answered = userAnswers.filter(a => a !== undefined).length; document.getElementById('progressBar').style.width = ((answered / questions.length) * 100) + '%'; document.getElementById('progressBar').textContent = `${answered}/${questions.length}`; }
        function finishQuiz() { let correct = 0; const wrongAnswers = []; const topicsToStudy = new Set(); questions.forEach((q, idx) => { if (userAnswers[idx] === q.correct) { correct++; } else { wrongAnswers.push({ question: q.question, userAnswer: q.options[userAnswers[idx]], correctAnswer: q.options[q.correct], topic: q.topic }); topicsToStudy.add(q.topic); } }); const pct = Math.round((correct / questions.length) * 100); document.getElementById('quizContent').style.display = 'none'; document.getElementById('resultContainer').style.display = 'block'; document.getElementById('scoreDisplay').textContent = `${correct}/${questions.length}`; document.getElementById('correctCount').textContent = correct; document.getElementById('incorrectCount').textContent = questions.length - correct; document.getElementById('successRate').textContent = pct + '%'; document.getElementById('celebrationEmoji').textContent = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '😊' : '📚'; if (wrongAnswers.length > 0) { let wrongHTML = '<div class="wrong-answers"><h3>❌ Yanlış Cevapladığın Sorular</h3>'; wrongAnswers.forEach((w, i) => { wrongHTML += `<div class="wrong-answer-item"><strong>Soru ${i+1}:</strong> ${w.question}<br><span style="color:#f44336;">Senin cevabın: ${w.userAnswer}</span><br><span class="correct-answer">✓ Doğru cevap: ${w.correctAnswer}</span></div>`; }); wrongHTML += '</div>'; document.getElementById('wrongAnswersSection').innerHTML = wrongHTML; } if (topicsToStudy.size > 0) { let topicsHTML = '<div class="topics-to-study"><h3>📚 Tekrar Etmen Gereken Konular</h3>'; Array.from(topicsToStudy).forEach(topic => { topicsHTML += `<div class="topic-item">📌 ${topic}</div>`; }); topicsHTML += '</div>'; document.getElementById('topicsSection').innerHTML = topicsHTML; } }
        function restartQuiz() { currentQuestion = 0; userAnswers = []; selectedOption = null; document.getElementById('quizContent').style.display = 'block'; document.getElementById('resultContainer').style.display = 'none'; document.getElementById('wrongAnswersSection').innerHTML = ''; document.getElementById('topicsSection').innerHTML = ''; loadQuestion(); }
        loadQuestion();
    </script>
</body>
</html>
