<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Dersler - BTY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .section p { line-height: 1.8; margin: 10px 0; color: #555; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📹 Video Dersler</h1>
            <p>Konuların Video Anlatımları ve Kaynaklar</p>
        </header>

        <div class="section">
            <h2>🇹🇷 Türkçe Kaynaklar</h2>
            <p>• <strong>EBA:</strong> MEB'in resmi ders videoları</p>
            <a href="https://www.eba.gov.tr" target="_blank"><button>🌐 EBA'ya Git</button></a>
            <p>• <strong>BTK Akademi:</strong> Ücretsiz sertifikalı kurslar</p>
            <a href="https://www.btkakademi.gov.tr" target="_blank"><button>🌐 BTK Akademi</button></a>
        </div>

        <div class="section">
            <h2>🌐 İngilizce Kaynaklar</h2>
            <p>• <strong>Code.org:</strong> Adım adım kodlama videoları</p>
            <a href="https://code.org" target="_blank"><button>🌐 Code.org</button></a>
            <p>• <strong>Scratch Tutorials:</strong> Resmi Scratch öğreticileri</p>
            <a href="https://scratch.mit.edu/ideas" target="_blank"><button>🌐 Scratch Ideas</button></a>
        </div>
    </div>
</body>
</html>
