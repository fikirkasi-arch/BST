<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otomatik Test Oluşturucu - BST Öğretmen Araçları</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #43e97b;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }

        .workflow {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
            margin: 20px 0;
        }

        .settings-panel {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .panel-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #43e97b;
            box-shadow: 0 0 0 3px rgba(67, 233, 123, 0.1);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-label:hover {
            background: #e7f9ef;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .difficulty-selector {
            display: flex;
            gap: 10px;
        }

        .difficulty-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .difficulty-btn:hover {
            border-color: #43e97b;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border-color: #43e97b;
        }

        .question-count {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .count-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #43e97b;
            color: white;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .count-btn:hover {
            background: #38f9d7;
            transform: scale(1.1);
        }

        .count-value {
            font-size: 2em;
            font-weight: bold;
            color: #43e97b;
            min-width: 60px;
            text-align: center;
        }

        .preview-area {
            background: #fafafa;
            border-radius: 15px;
            padding: 30px;
            min-height: 800px;
        }

        .test-paper {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }

        .test-header {
            text-align: center;
            border-bottom: 3px solid #43e97b;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .test-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 10px;
        }

        .test-info {
            display: flex;
            justify-content: space-around;
            color: #666;
            font-size: 0.95em;
            margin-top: 15px;
        }

        .question-item {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 4px solid #43e97b;
        }

        .question-number {
            font-weight: bold;
            color: #43e97b;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.05em;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .options {
            margin-left: 20px;
        }

        .option {
            padding: 8px 0;
            color: #555;
        }

        .answer-key {
            background: #e7f9ef;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            border: 2px solid #43e97b;
        }

        .answer-key-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #43e97b;
            margin-bottom: 15px;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .answer-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .stats {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 2px solid #e0e0e0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #43e97b;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 20px;
            }
            .workflow {
                display: block;
            }
            .settings-panel {
                display: none;
            }
            .btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Otomatik Test Oluşturucu</h1>
        <p class="subtitle">Öğretmenler için Hızlı ve Kolay Test Hazırlama Aracı</p>

        <div class="workflow">
            <div class="settings-panel">
                <div class="panel-title">⚙️ Test Ayarları</div>

                <div class="form-group">
                    <label class="form-label">🎓 Sınıf Seviyesi</label>
                    <select class="form-control" id="gradeSelect" onchange="updateUnits()">
                        <option value="5">5. Sınıf</option>
                        <option value="6">6. Sınıf</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">📚 Üniteler</label>
                    <div class="checkbox-group" id="unitCheckboxes"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">⭐ Zorluk Seviyesi</label>
                    <div class="difficulty-selector">
                        <button class="difficulty-btn active" onclick="selectDifficulty('kolay')">Kolay</button>
                        <button class="difficulty-btn" onclick="selectDifficulty('orta')">Orta</button>
                        <button class="difficulty-btn" onclick="selectDifficulty('zor')">Zor</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">🔢 Soru Sayısı</label>
                    <div class="question-count">
                        <button class="count-btn" onclick="changeCount(-5)">-</button>
                        <div class="count-value" id="questionCount">10</div>
                        <button class="count-btn" onclick="changeCount(5)">+</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">📄 Test Başlığı</label>
                    <input type="text" class="form-control" id="testTitle" value="Bilişim Teknolojileri Yazılı Sınavı" placeholder="Test başlığı...">
                </div>

                <div class="form-group">
                    <label class="form-label">🏫 Okul Adı (Opsiyonel)</label>
                    <input type="text" class="form-control" id="schoolName" placeholder="Okul adı...">
                </div>

                <div class="stats">
                    <div class="stat-row">
                        <span class="stat-label">📊 Toplam Soru Havuzu:</span>
                        <span class="stat-value" id="totalQuestions">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">✅ Seçilecek Soru:</span>
                        <span class="stat-value" id="selectedCount">10</span>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="generateTest()">🎲 Test Oluştur</button>
                <button class="btn btn-success" onclick="printTest()">🖨️ Yazdır / PDF</button>
                <button class="btn btn-info" onclick="toggleAnswerKey()">🔑 Cevap Anahtarı</button>
                <button class="btn btn-secondary" onclick="window.location.href='index.html'">🏠 Ana Sayfa</button>
            </div>

            <div class="preview-area">
                <div id="testPreview">
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <h3>Henüz test oluşturulmadı</h3>
                        <p>Soldaki ayarları yapıp "Test Oluştur" butonuna tıklayın</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentGrade = 5;
        let currentDifficulty = 'kolay';
        let questionCountValue = 10;
        let selectedUnits = [];
        let generatedTest = null;
        let showAnswers = false;

        const units = {
            5: ['Bilişim Temelleri', 'Dijital Ürün', 'Ağlar İletişim', 'Etik Güvenlik', 'Yapay Zeka', 'Programlama'],
            6: ['Bilişim Teknolojileri', 'Etik Güvenlik', 'İletişim İşbirliği', 'Ürün Oluşturma', 'Problem Çözme']
        };

        const questionBank = {
            5: {
                kolay: [
                    { q: 'Bilgisayarın beyni olarak adlandırılan donanım parçası hangisidir?', o: ['A) RAM', 'B) Hard Disk', 'C) İşlemci (CPU)', 'D) Ekran Kartı'], a: 'C', unit: 'Bilişim Temelleri' },
                    { q: 'Aşağıdakilerden hangisi giriş birimidir?', o: ['A) Monitör', 'B) Klavye', 'C) Hoparlör', 'D) Yazıcı'], a: 'B', unit: 'Bilişim Temelleri' },
                    { q: 'İşletim sistemi aşağıdakilerden hangisidir?', o: ['A) Microsoft Word', 'B) Google Chrome', 'C) Windows 10', 'D) Adobe Photoshop'], a: 'C', unit: 'Bilişim Temelleri' },
                    { q: 'Bilgisayarda verilerin kalıcı olarak saklandığı donanım hangisidir?', o: ['A) RAM', 'B) Hard Disk', 'C) İşlemci', 'D) Ekran Kartı'], a: 'B', unit: 'Bilişim Temelleri' },
                    { q: 'Ağ üzerinden birbirine bağlı bilgisayarlar arasında veri aktarımını sağlayan cihaz hangisidir?', o: ['A) Monitör', 'B) Yazıcı', 'C) Router', 'D) Klavye'], a: 'C', unit: 'Ağlar İletişim' },
                    { q: 'Güçlü bir şifre oluştururken hangisine dikkat edilmelidir?', o: ['A) Sadece küçük harf kullanılmalı', 'B) Kısa olmalı', 'C) Büyük-küçük harf, sayı ve özel karakter içermeli', 'D) Doğum tarihi kullanılmalı'], a: 'C', unit: 'Etik Güvenlik' },
                    { q: 'E-posta adresi hangi karakterle ayrılır?', o: ['A) #', 'B) @', 'C) &', 'D) *'], a: 'B', unit: 'Ağlar İletişim' },
                    { q: 'Yapay zeka hangi alanda kullanılmaz?', o: ['A) Sağlık', 'B) Eğitim', 'C) Ulaşım', 'D) Hiçbiri (hepsinde kullanılır)'], a: 'D', unit: 'Yapay Zeka' },
                    { q: 'Scratch programında karakterlere ne ad verilir?', o: ['A) Sprite', 'B) Block', 'C) Stage', 'D) Script'], a: 'A', unit: 'Programlama' },
                    { q: 'Dijital ürün tasarımında ilk adım nedir?', o: ['A) Kodlama', 'B) Planlama', 'C) Test etme', 'D) Yayınlama'], a: 'B', unit: 'Dijital Ürün' },
                    { q: 'Microsoft Word hangi tür programdır?', o: ['A) İşletim sistemi', 'B) Kelime işlemci', 'C) Tarayıcı', 'D) Antivirüs'], a: 'B', unit: 'Dijital Ürün' },
                    { q: 'Bilgisayar ağlarında veri paketleri hangi protokol ile taşınır?', o: ['A) HTTP', 'B) FTP', 'C) IP', 'D) DNS'], a: 'C', unit: 'Ağlar İletişim' },
                    { q: 'Phishing saldırısı nedir?', o: ['A) Virüs bulaştırma', 'B) Sahte e-posta ile bilgi çalma', 'C) Bilgisayarı yavaşlatma', 'D) Ağ bağlantısını kesme'], a: 'B', unit: 'Etik Güvenlik' },
                    { q: 'RAM\'in açılımı nedir?', o: ['A) Random Access Memory', 'B) Read All Memory', 'C) Run And Move', 'D) Rapid Access Mode'], a: 'A', unit: 'Bilişim Temelleri' },
                    { q: 'Scratch\'te döngü bloğu ne işe yarar?', o: ['A) Ses çıkarmak', 'B) Renk değiştirmek', 'C) Komutları tekrar etmek', 'D) Sprite silmek'], a: 'C', unit: 'Programlama' }
                ],
                orta: [
                    { q: 'Cache bellek hangi donanım parçasında bulunur?', o: ['A) Hard Disk', 'B) RAM', 'C) İşlemci', 'D) Anakart'], a: 'C', unit: 'Bilişim Temelleri' },
                    { q: 'LAN ağı neyi ifade eder?', o: ['A) Yerel Alan Ağı', 'B) Geniş Alan Ağı', 'C) Kablosuz Ağ', 'D) İnternet Ağı'], a: 'A', unit: 'Ağlar İletişim' },
                    { q: 'Firewall (Güvenlik Duvarı) ne işe yarar?', o: ['A) Virüs temizler', 'B) Ağ trafiğini kontrol eder', 'C) Dosyaları şifreler', 'D) Bilgisayarı hızlandırır'], a: 'B', unit: 'Etik Güvenlik' },
                    { q: 'Makine öğrenmesi hangi alanla ilgilidir?', o: ['A) Donanım', 'B) Yapay Zeka', 'C) Ağ Güvenliği', 'D) Ofis Programları'], a: 'B', unit: 'Yapay Zeka' },
                    { q: 'Algoritma nedir?', o: ['A) Programlama dili', 'B) Problem çözme adımları', 'C) Bilgisayar oyunu', 'D) Donanım parçası'], a: 'B', unit: 'Programlama' },
                    { q: 'HTTP protokolü ne için kullanılır?', o: ['A) E-posta gönderme', 'B) Web sayfalarını görüntüleme', 'C) Dosya aktarımı', 'D) Uzaktan bağlantı'], a: 'B', unit: 'Ağlar İletişim' },
                    { q: 'SSD ve HDD arasındaki temel fark nedir?', o: ['A) SSD daha hızlıdır', 'B) HDD daha hızlıdır', 'C) Fark yoktur', 'D) SSD daha büyüktür'], a: 'A', unit: 'Bilişim Temelleri' },
                    { q: 'İki faktörlü kimlik doğrulama neden önemlidir?', o: ['A) Daha hızlı giriş sağlar', 'B) Ekstra güvenlik katmanı ekler', 'C) Şifre gerektirmez', 'D) Ücretsizdir'], a: 'B', unit: 'Etik Güvenlik' },
                    { q: 'Scratch\'te "eğer...ise" bloğu ne tür bir yapıdır?', o: ['A) Döngü', 'B) Koşul', 'C) Değişken', 'D) Operatör'], a: 'B', unit: 'Programlama' },
                    { q: 'Bulut bilişim ne demektir?', o: ['A) Hava durumu tahmini', 'B) İnternet üzerinden veri depolama', 'C) Kablosuz bağlantı', 'D) Yeni işletim sistemi'], a: 'B', unit: 'Dijital Ürün' },
                    { q: 'DNS sistemi ne işe yarar?', o: ['A) Antivirüs taraması', 'B) Domain adlarını IP\'ye çevirir', 'C) Dosya sıkıştırma', 'D) E-posta gönderme'], a: 'B', unit: 'Ağlar İletişim' },
                    { q: 'Malware genel olarak neyi ifade eder?', o: ['A) Yararlı yazılım', 'B) Zararlı yazılım', 'C) İşletim sistemi', 'D) Oyun programı'], a: 'B', unit: 'Etik Güvenlik' },
                    { q: 'Yapay sinir ağları neyi taklit eder?', o: ['A) Bilgisayar ağlarını', 'B) İnsan beynini', 'C) İnternet bağlantısını', 'D) Dosya sistemini'], a: 'B', unit: 'Yapay Zeka' },
                    { q: 'Scratch\'te değişken ne için kullanılır?', o: ['A) Müzik çalmak', 'B) Veri saklamak', 'C) Renk değiştirmek', 'D) Hareket ettirmek'], a: 'B', unit: 'Programlama' },
                    { q: 'Pixel nedir?', o: ['A) Ekran çözünürlüğü birimi', 'B) Ses dosyası formatı', 'C) Ağ protokolü', 'D) Programlama dili'], a: 'A', unit: 'Dijital Ürün' }
                ],
                zor: [
                    { q: 'Von Neumann mimarisi hangi kavramı tanımlar?', o: ['A) Ağ yapısı', 'B) Bilgisayar mimarisi', 'C) Güvenlik protokolü', 'D) Programlama paradigması'], a: 'B', unit: 'Bilişim Temelleri' },
                    { q: 'OSI modelinde kaç katman vardır?', o: ['A) 5', 'B) 6', 'C) 7', 'D) 8'], a: 'C', unit: 'Ağlar İletişim' },
                    { q: 'End-to-end şifreleme ne anlama gelir?', o: ['A) Sadece gönderici şifreler', 'B) Sadece alıcı şifreler', 'C) Uçtan uca şifreleme', 'D) Sunucu şifreler'], a: 'C', unit: 'Etik Güvenlik' },
                    { q: 'Derin öğrenme ve makine öğrenmesi arasındaki fark nedir?', o: ['A) Derin öğrenme daha fazla katman kullanır', 'B) Hiçbir fark yok', 'C) Makine öğrenmesi daha yenidir', 'D) Derin öğrenme donanım gerektirmez'], a: 'A', unit: 'Yapay Zeka' },
                    { q: 'Recursive (özyinelemeli) fonksiyon ne demektir?', o: ['A) Hiç çalışmayan fonksiyon', 'B) Kendini çağıran fonksiyon', 'C) En hızlı fonksiyon', 'D) Döngü içermeyen fonksiyon'], a: 'B', unit: 'Programlama' }
                ]
            },
            6: {
                kolay: [
                    { q: 'Dosya uzantısı ".xlsx" hangi programa aittir?', o: ['A) Word', 'B) PowerPoint', 'C) Excel', 'D) Paint'], a: 'C', unit: 'Ürün Oluşturma' },
                    { q: 'KVKK ne anlama gelir?', o: ['A) Kişisel Verileri Koruma Kanunu', 'B) Kamu Veri Kayıt Kurumu', 'C) Kontrol Ve Kayıt Kanunu', 'D) Koruma Vizyon Kanunu'], a: 'A', unit: 'Etik Güvenlik' },
                    { q: 'HTML ne için kullanılır?', o: ['A) Veritabanı yönetimi', 'B) Web sayfası oluşturma', 'C) Fotoğraf düzenleme', 'D) Virüs temizleme'], a: 'B', unit: 'Ürün Oluşturma' },
                    { q: 'Python\'da yorum satırı hangi karakterle başlar?', o: ['A) //', 'B) #', 'C) /*', 'D) --'], a: 'B', unit: 'Problem Çözme' },
                    { q: 'Bulut depolama hizmetine örnek hangisidir?', o: ['A) Windows', 'B) Google Drive', 'C) Paint', 'D) Calculator'], a: 'B', unit: 'İletişim İşbirliği' },
                    { q: 'Video düzenleme programına örnek hangisidir?', o: ['A) Notepad', 'B) Excel', 'C) Adobe Premiere', 'D) PowerPoint'], a: 'C', unit: 'Ürün Oluşturma' },
                    { q: 'Akış diyagramında karar bloğu hangi şekildir?', o: ['A) Dikdörtgen', 'B) Baklava', 'C) Daire', 'D) Üçgen'], a: 'B', unit: 'Problem Çözme' },
                    { q: 'Sosyal mühendislik saldırısı neyi hedefler?', o: ['A) Donanım', 'B) İnsan zayıflığı', 'C) Ağ kablosu', 'D) Yazıcı'], a: 'B', unit: 'Etik Güvenlik' },
                    { q: 'Python\'da print() fonksiyonu ne işe yarar?', o: ['A) Dosya okur', 'B) Ekrana yazdırır', 'C) Hesaplama yapar', 'D) Değişken oluşturur'], a: 'B', unit: 'Problem Çözme' },
                    { q: 'Dijital ayak izi nedir?', o: ['A) Parmak izi tarayıcı', 'B) İnternetteki izlerimiz', 'C) Ayak fotoğrafı', 'D) Yeni teknoloji'], a: 'B', unit: 'Etik Güvenlik' },
                    { q: 'Excel\'de hücre adresi nasıl gösterilir?', o: ['A) 1A', 'B) A1', 'C) A-1', 'D) 1-A'], a: 'B', unit: 'Bilişim Teknolojileri' },
                    { q: 'Google Docs hangi tür araçtır?', o: ['A) İşbirlikli döküman', 'B) Antivirüs', 'C) Oyun', 'D) İşletim sistemi'], a: 'A', unit: 'İletişim İşbirliği' },
                    { q: 'Hangi dosya formatı video içindir?', o: ['A) .docx', 'B) .xlsx', 'C) .mp4', 'D) .txt'], a: 'C', unit: 'Ürün Oluşturma' },

                ],

                    { q: 'DDoS saldırısı ne yapar?', o: ['A) Virüs bulaştırır', 'B) Sunucuyu trafikle yavaşlatır', 'C) Dosyaları şifreler', 'D) Hesap çalar'], a: 'B', unit: 'Etik Güvenlik' },

                ]
            }
        };

        function updateUnits() {
            currentGrade = parseInt(document.getElementById('gradeSelect').value);
            const unitList = units[currentGrade];
            const container = document.getElementById('unitCheckboxes');
            container.innerHTML = '';
            selectedUnits = [];

            unitList.forEach((unit, index) => {
                container.innerHTML += `
                    <label class="checkbox-label">
                        <input type="checkbox" value="${unit}" onchange="toggleUnit('${unit}')" checked>
                        <span>${unit}</span>
                    </label>
                `;
                selectedUnits.push(unit);
            });

            updateQuestionPool();
        }

        function toggleUnit(unit) {
            if (selectedUnits.includes(unit)) {
                selectedUnits = selectedUnits.filter(u => u !== unit);
            } else {
                selectedUnits.push(unit);
            }
            updateQuestionPool();
        }

        function selectDifficulty(difficulty) {
            currentDifficulty = difficulty;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateQuestionPool();
        }

        function changeCount(delta) {
            questionCountValue = Math.max(5, Math.min(50, questionCountValue + delta));
            document.getElementById('questionCount').textContent = questionCountValue;
            document.getElementById('selectedCount').textContent = questionCountValue;
        }

        function updateQuestionPool() {
            const pool = questionBank[currentGrade][currentDifficulty].filter(q =>
                selectedUnits.includes(q.unit)
            );
            document.getElementById('totalQuestions').textContent = pool.length;
        }

        function generateTest() {
            const testTitle = document.getElementById('testTitle').value || 'Bilişim Teknolojileri Yazılı Sınavı';
            const schoolName = document.getElementById('schoolName').value;

            const pool = questionBank[currentGrade][currentDifficulty].filter(q =>
                selectedUnits.includes(q.unit)
            );

            if (pool.length < questionCountValue) {
                alert(`⚠️ Seçtiğiniz kriterlere göre yeterli soru yok! Maksimum ${pool.length} soru oluşturulabilir.`);
                return;
            }

            // Rastgele soru seç
            const shuffled = pool.sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, questionCountValue);

            generatedTest = {
                title: testTitle,
                school: schoolName,
                grade: currentGrade,
                difficulty: currentDifficulty,
                questions: selected,
                date: new Date().toLocaleDateString('tr-TR')
            };

            renderTest();
        }

        function renderTest() {
            if (!generatedTest) return;

            const test = generatedTest;
            let html = `
                <div class="test-paper" id="testPaper">
                    <div class="test-header">
                        ${test.school ? `<div style="font-size: 1.2em; margin-bottom: 10px;">${test.school}</div>` : ''}
                        <div class="test-title">${test.title}</div>
                        <div style="font-size: 1.1em; color: #666; margin-top: 10px;">
                            ${test.grade}. Sınıf - Zorluk: ${test.difficulty.charAt(0).toUpperCase() + test.difficulty.slice(1)}
                        </div>
                        <div class="test-info">
                            <div>📅 Tarih: ${test.date}</div>
                            <div>📊 Soru Sayısı: ${test.questions.length}</div>
                            <div>✏️ Adı Soyadı: _________________</div>
                        </div>
                    </div>

                    ${test.questions.map((q, index) => `
                        <div class="question-item">
                            <div class="question-number">Soru ${index + 1}</div>
                            <div class="question-text">${q.q}</div>
                            <div class="options">
                                ${q.o.map(opt => `<div class="option">${opt}</div>`).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            if (showAnswers) {
                html += `
                    <div class="answer-key">
                        <div class="answer-key-title">🔑 CEVAP ANAHTARI</div>
                        <div class="answers-grid">
                            ${test.questions.map((q, index) => `
                                <div class="answer-item">${index + 1}) ${q.a}</div>
                            `).join('')}
                        </div>
                        <div style="margin-top: 20px; padding: 15px; background: white; border-radius: 5px;">
                            <strong>Puanlama:</strong> Her soru ${(100 / test.questions.length).toFixed(1)} puan
                        </div>
                    </div>
                `;
            }

            document.getElementById('testPreview').innerHTML = html;
        }

        function toggleAnswerKey() {
            if (!generatedTest) {
                alert('⚠️ Önce bir test oluşturun!');
                return;
            }
            showAnswers = !showAnswers;
            renderTest();
        }

        function printTest() {
            if (!generatedTest) {
                alert('⚠️ Önce bir test oluşturun!');
                return;
            }
            window.print();
        }

        // Sayfa yüklendiğinde
        updateUnits();
    </script>
</body>
</html>
